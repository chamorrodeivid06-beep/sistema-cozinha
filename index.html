  <script type="text/babel">
    const { useState, useEffect, useRef, useMemo } = React;
    
    const SUPABASE_URL = 'https://ddngvelrtqmfgaeqsjem.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_EhLCuypZr6vHrSKDCrHxQg_n7BvKxBU';

    // ==========================================
    // COMPONENTE: LIVE CURSOR (SUPORTE AO VIVO)
    // ==========================================
    function LiveCursor({ companyId, currentUsername, currentUserRole, targetUsername, isActive, supabaseClient }) {
      const [remoteCursor, setRemoteCursor] = useState(null);
      const [isRemoteOnline, setIsRemoteOnline] = useState(false);
      const [clickRipples, setClickRipples] = useState([]);
      const lastEmitRef = useRef(0);
      const lastScrollEmitRef = useRef(0);
      const timeoutRef = useRef(null);
      const isReceivingScrollRef = useRef(false);

      useEffect(() => {
        if (!isActive || !companyId || !targetUsername || !supabaseClient) {
          setRemoteCursor(null);
          return;
        }

        const channel = supabaseClient.channel(`cursor-${companyId}-${targetUsername}`, {
          config: { broadcast: { self: false } }
        });

        channel
          .on('broadcast', { event: 'cursor-pos' }, ({ payload }) => {
            if (payload && payload.sender !== currentUsername) {
              setRemoteCursor({ xRatio: payload.xRatio, yRatio: payload.yRatio, sender: payload.sender, role: payload.role });
              setIsRemoteOnline(true);
              if (timeoutRef.current) clearTimeout(timeoutRef.current);
              timeoutRef.current = setTimeout(() => setIsRemoteOnline(false), 4000);
            }
          })
          .on('broadcast', { event: 'cursor-click' }, ({ payload }) => {
            if (payload && payload.sender !== currentUsername) {
              const posX = payload.xRatio * window.innerWidth;
              const posY = payload.yRatio * window.innerHeight;
              const rippleId = Date.now();
              setClickRipples(prev => [...prev, { id: rippleId, x: posX, y: posY }]);
              setTimeout(() => setClickRipples(prev => prev.filter(r => r.id !== rippleId)), 800);

              const el = document.elementFromPoint(posX, posY);
              if (el) {
                el.click();
                if (['INPUT', 'SELECT', 'TEXTAREA'].includes(el.tagName)) el.focus();
              }
            }
          })
          .on('broadcast', { event: 'page-scroll' }, ({ payload }) => {
            if (payload && payload.sender !== currentUsername) {
              isReceivingScrollRef.current = true;
              const maxScroll = document.documentElement.scrollHeight - window.innerHeight;
              window.scrollTo({ top: payload.scrollRatio * (maxScroll > 0 ? maxScroll : 1), behavior: 'smooth' });
              setTimeout(() => { isReceivingScrollRef.current = false; }, 150);
            }
          })
          .subscribe();

        const handleMouseMove = (e) => {
          const now = Date.now();
          if (now - lastEmitRef.current > 25) {
            lastEmitRef.current = now;
            channel.send({
              type: 'broadcast',
              event: 'cursor-pos',
              payload: { xRatio: e.clientX / window.innerWidth, yRatio: e.clientY / window.innerHeight, sender: currentUsername, role: currentUserRole || 'operador' }
            });
          }
        };

        const handleClick = (e) => {
          channel.send({
            type: 'broadcast',
            event: 'cursor-click',
            payload: { xRatio: e.clientX / window.innerWidth, yRatio: e.clientY / window.innerHeight, sender: currentUsername }
          });
        };

        const handleScroll = () => {
          if (isReceivingScrollRef.current) return;
          const now = Date.now();
          if (now - lastScrollEmitRef.current > 40) {
            lastScrollEmitRef.current = now;
            const maxScroll = document.documentElement.scrollHeight - window.innerHeight;
            channel.send({
              type: 'broadcast',
              event: 'page-scroll',
              payload: { scrollRatio: maxScroll > 0 ? window.scrollY / maxScroll : 0, sender: currentUsername }
            });
          }
        };

        window.addEventListener('mousemove', handleMouseMove);
        window.addEventListener('click', handleClick);
        window.addEventListener('scroll', handleScroll, { passive: true });

        return () => {
          window.removeEventListener('mousemove', handleMouseMove);
          window.removeEventListener('click', handleClick);
          window.removeEventListener('scroll', handleScroll);
          if (timeoutRef.current) clearTimeout(timeoutRef.current);
          supabaseClient.removeChannel(channel);
        };
      }, [isActive, companyId, targetUsername, currentUsername, currentUserRole, supabaseClient]);

      if (!isActive || !remoteCursor || !isRemoteOnline) return null;

      const posX = remoteCursor.xRatio * (typeof window !== 'undefined' ? window.innerWidth : 1000);
      const posY = remoteCursor.yRatio * (typeof window !== 'undefined' ? window.innerHeight : 800);
      const isSuper = remoteCursor.role === 'superadmin' || remoteCursor.sender === 'admin';

      return (
        <div className="fixed inset-0 pointer-events-none z-[9999] overflow-hidden">
          {clickRipples.map(ripple => (
            <span key={ripple.id} style={{ left: ripple.x - 18, top: ripple.y - 18 }} className="absolute w-9 h-9 rounded-full border-2 border-[#D95B1E] animate-ping opacity-90 pointer-events-none" />
          ))}
          <div style={{ transform: `translate3d(${posX}px, ${posY}px, 0)`, transition: 'transform 0.04s linear' }} className="absolute top-0 left-0 flex flex-col items-start select-none">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" className="drop-shadow-[0_2px_8px_rgba(0,0,0,0.8)] -translate-x-1 -translate-y-1">
              <path d="M5.65 2.15C5.1 1.6 4.25 2.05 4.3 2.85L5.75 19.35C5.8 20.05 6.7 20.35 7.2 19.85L11.5 15.5L16.2 21.8C16.5 22.2 17.1 22.3 17.5 22L20.2 20C20.6 19.7 20.7 19.1 20.4 18.7L15.7 12.4L21.4 11.2C22.1 11.05 22.3 10.15 21.75 9.75L5.65 2.15Z" fill={isSuper ? '#D95B1E' : '#10B981'} stroke="#000000" strokeWidth="1.5" />
            </svg>
            <div className={`ml-3 -mt-1 px-2 py-0.5 rounded-full text-[10px] font-black uppercase tracking-wider text-white shadow-xl flex items-center gap-1.5 border border-black/30 ${isSuper ? 'bg-[#D95B1E]' : 'bg-emerald-600'}`}>
              <span className="w-1.5 h-1.5 rounded-full bg-white animate-ping" />
              <span>{isSuper ? `Suporte (${remoteCursor.sender})` : remoteCursor.sender}</span>
            </div>
          </div>
        </div>
      );
    }

    // ==========================================
    // COMPONENTE: SUPPORT CHAT (CHAT EM TEMPO REAL)
    // ==========================================
    function SupportChat({ companyId, currentUsername, currentUserRole, operatorUsername, isVisible, supabaseClient }) {
      const [isOpen, setIsOpen] = useState(false);
      const [messages, setMessages] = useState([]);
      const [newMessage, setNewMessage] = useState('');
      const [unreadCount, setUnreadCount] = useState(0);
      const messagesEndRef = useRef(null);

      const fetchMessages = async () => {
        if (!companyId || !operatorUsername || !supabaseClient) return;
        try {
          const { data } = await supabaseClient
            .from('support_messages')
            .select('*')
            .eq('company_id', companyId)
            .eq('operator_username', operatorUsername)
            .order('created_at', { ascending: true });
          if (data) setMessages(data);
        } catch (err) {}
      };

      useEffect(() => {
        if (!isVisible || !companyId || !operatorUsername || !supabaseClient) return;
        fetchMessages();

        const channel = supabaseClient.channel(`chat-${companyId}-${operatorUsername}`)
          .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'support_messages', filter: `operator_username=eq.${operatorUsername}` }, (payload) => {
            if (payload.new && payload.new.company_id === companyId) {
              setMessages(prev => [...prev, payload.new]);
              if (!isOpen && payload.new.sender_username !== currentUsername) setUnreadCount(c => c + 1);
            }
          }).subscribe();

        return () => { supabaseClient.removeChannel(channel); };
      }, [companyId, operatorUsername, isOpen, currentUsername, isVisible, supabaseClient]);

      useEffect(() => {
        if (isOpen) messagesEndRef.current?.scrollIntoView({ behavior: 'smooth' });
      }, [messages, isOpen]);

      if (!isVisible || !companyId || !operatorUsername) return null;

      const handleSendMessage = async (e) => {
        e.preventDefault();
        const text = newMessage.trim();
        if (!text) return;
        setNewMessage('');
        try {
          await supabaseClient.from('support_messages').insert([{
            company_id: companyId,
            operator_username: operatorUsername,
            sender_username: currentUsername,
            sender_role: currentUserRole || 'operador',
            message: text
          }]);
        } catch (err) {}
      };

      return (
        <div className="fixed bottom-5 right-5 z-50 flex flex-col items-end">
          {isOpen && (
            <div className="w-80 sm:w-96 h-[480px] bg-[#161616] border border-[#2d2d2d] rounded-2xl shadow-2xl flex flex-col overflow-hidden mb-3">
              <div className="p-4 bg-[#111111] border-b border-[#262626] flex items-center justify-between">
                <div className="flex items-center gap-2.5">
                  <div className="w-8 h-8 rounded-full bg-[#D95B1E]/10 border border-[#D95B1E]/30 flex items-center justify-center text-[#D95B1E]">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10"/></svg>
                  </div>
                  <div>
                    <h4 className="text-xs font-bold text-white flex items-center gap-1.5">
                      Canal Direto de Suporte
                      <span className="w-2 h-2 rounded-full bg-emerald-500 animate-pulse" />
                    </h4>
                    <p className="text-[10px] text-zinc-400">Atendimento: <strong className="text-[#D95B1E]">{operatorUsername}</strong></p>
                  </div>
                </div>
                <button onClick={() => setIsOpen(false)} className="text-zinc-400 hover:text-white p-1 rounded-lg">
                  <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
                </button>
              </div>

              <div className="flex-1 p-4 overflow-y-auto space-y-3 text-xs">
                {messages.length === 0 ? (
                  <div className="h-full flex flex-col items-center justify-center text-center text-zinc-500 space-y-2">
                    <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round" className="text-zinc-700"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
                    <p className="text-[11px]">Nenhuma mensagem ainda.<br />Inicie a conversa pelo suporte.</p>
                  </div>
                ) : (
                  messages.map(m => {
                    const isMe = m.sender_username?.toLowerCase() === currentUsername?.toLowerCase();
                    return (
                      <div key={m.id} className={`flex flex-col ${isMe ? 'items-end' : 'items-start'}`}>
                        <span className="text-[10px] text-zinc-500 mb-0.5 px-1">{isMe ? 'Você' : m.sender_username} ({m.sender_role})</span>
                        <div className={`max-w-[85%] px-3 py-2 rounded-xl text-xs leading-relaxed ${isMe ? 'bg-[#D95B1E] text-white font-medium rounded-tr-none' : 'bg-[#222222] text-white rounded-tl-none border border-[#333]'}`}>
                          {m.message}
                        </div>
                        <span className="text-[9px] text-zinc-600 mt-0.5 px-1 font-mono">{new Date(m.created_at).toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' })}</span>
                      </div>
                    );
                  })
                )}
                <div ref={messagesEndRef} />
              </div>

              <form onSubmit={handleSendMessage} className="p-3 bg-[#111111] border-t border-[#262626] flex items-center gap-2">
                <input type="text" placeholder="Digite sua mensagem..." value={newMessage} onChange={e => setNewMessage(e.target.value)} className="flex-1 bg-[#1c1c1c] border border-[#333] rounded-xl px-3 py-2 text-xs text-white outline-none focus:border-[#D95B1E] transition-colors placeholder:text-zinc-500" />
                <button type="submit" className="bg-[#D95B1E] hover:bg-[#c34e17] text-white p-2 rounded-xl transition-all shadow-md disabled:opacity-40" disabled={!newMessage.trim()}>
                  <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></svg>
                </button>
              </form>
            </div>
          )}

          <button onClick={() => { if (!isOpen) setUnreadCount(0); setIsOpen(!isOpen); }} className="w-14 h-14 rounded-full bg-[#D95B1E] hover:bg-[#c34e17] text-white shadow-2xl flex items-center justify-center transition-transform hover:scale-105 active:scale-95 relative border-2 border-orange-400/30 cursor-pointer" title="Abrir Chat de Suporte">
            <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
            {unreadCount > 0 && <span className="absolute -top-1 -right-1 bg-red-600 text-white text-[10px] font-bold w-5 h-5 rounded-full flex items-center justify-center border-2 border-black">{unreadCount}</span>}
          </button>
        </div>
      );
    }

    // ==========================================
    // APLICAÇÃO PRINCIPAL (APP)
    // ==========================================
    function App() {
      const [currentUser, setCurrentUser] = useState(() => {
        try {
          const s = localStorage.getItem('foodstrick_master_session');
          return s ? JSON.parse(s) : null;
        } catch(e) { return null; }
      });

      const [isAuthenticated, setIsAuthenticated] = useState(() => Boolean(currentUser));

      const [mobileMenuOpen, setMobileMenuOpen] = useState(false);
      const [impersonatedCompany, setImpersonatedCompany] = useState(null);
      const [adminInsideNotification, setAdminInsideNotification] = useState(null);

      const [username, setUsername] = useState('');
      const [password, setPassword] = useState('');
      const [showPassword, setShowPassword] = useState(false);
      const [authError, setAuthError] = useState('');

      const [abaAtiva, setAbaAtiva] = useState('painel'); 
      const [subAbaConfig, setSubAbaConfig] = useState('conta'); 

      // Cache isolado especificamente pela empresa conectada
      const activeCompId = impersonatedCompany ? impersonatedCompany.company_id : currentUser?.company_id;

      const [produtos, setProdutos] = useState(() => {
        try {
          if (!activeCompId) return [];
          const c = localStorage.getItem(`cache_prods_${activeCompId}`);
          return c ? JSON.parse(c) : [];
        } catch(e) { return []; }
      });

      const [lancamentos, setLancamentos] = useState(() => {
        try {
          if (!activeCompId) return [];
          const c = localStorage.getItem(`cache_lancs_${activeCompId}`);
          return c ? JSON.parse(c) : [];
        } catch(e) { return []; }
      });

      const [historicoFechamentos, setHistoricoFechamentos] = useState([]);
      const [processandoFechamento, setProcessandoFechamento] = useState(false);

      const [modalExclusao, setModalExclusao] = useState({ aberto: false, idLancamento: null });
      const [motivoExclusao, setMotivoExclusao] = useState('Pedido cancelado');
      const [modalExcluirProduto, setModalExcluirProduto] = useState({ aberto: false, idProduto: null, nome: '' });
      
      const [modalEditarProduto, setModalEditarProduto] = useState({ aberto: false, id: null, nome: '', preco_venda: '', custo_unitario: '', observacao: '' });
      const [modalFichaTecnica, setModalFichaTecnica] = useState({ aberto: false, produto: null });
      const [novoInsumo, setNovoInsumo] = useState({ nome: '', quantidade: '', custo: '' });

      const [novoLancamento, setNovoLancamento] = useState({
        data: new Date().toISOString().split('T')[0],
        tipo: 'Venda', produto_id: '', descricao: '', quantidade: 1, 
        pagamento: 'Pix', canal_categoria: 'Delivery', valor_despesa: '', fornecedor: ''
      });

      const [novoProduto, setNovoProduto] = useState({ nome: '', preco_venda: '', custo_unitario: '', observacao: '' });

      const [companiesList, setCompaniesList] = useState([]);
      const [newCompanyName, setNewCompanyName] = useState('');
      const [newCompanySlug, setNewCompanySlug] = useState('');
      const [newCompanyPhone, setNewCompanyPhone] = useState('');
      const [newCompanyAdminUser, setNewCompanyAdminUser] = useState('');
      const [newCompanyAdminPass, setNewCompanyAdminPass] = useState('');

      const avatarInputRef = useRef(null);

      const isSuperAdmin = currentUser?.role === 'superadmin' || currentUser?.username === 'admin';
      const effectiveCompanyId = impersonatedCompany ? impersonatedCompany.company_id : currentUser?.company_id;
      const effectiveCompanyName = impersonatedCompany ? impersonatedCompany.company_name : (currentUser?.unidade || 'FoodStrick');

      // Verificação em segundo plano da presença de suporte
      useEffect(() => {
        if (!isAuthenticated || !currentUser || isSuperAdmin) return;
        const checkSupport = async () => {
          try {
            const { data } = await supabaseClient.from('app_users').select('active_support_by').eq('company_id', currentUser.company_id).maybeSingle();
            if (data && data.active_support_by) setAdminInsideNotification(data.active_support_by);
            else setAdminInsideNotification(null);
          } catch (err) {}
        };
        checkSupport();
        const interval = setInterval(checkSupport, 12000);
        return () => clearInterval(interval);
      }, [isAuthenticated, currentUser, isSuperAdmin]);

      // CARREGAMENTO RIGOROSO: Cada empresa acede unicamente aos seus dados
      useEffect(() => {
        if (isAuthenticated && effectiveCompanyId && effectiveCompanyId !== 'foodstrick-master') {
          carregarTudoEmParalelo(effectiveCompanyId);
        }
      }, [isAuthenticated, effectiveCompanyId]);

      async function carregarTudoEmParalelo(compId) {
        try {
          let queryProd = supabaseClient.from('produtos').select('*');
          let queryLanc = supabaseClient.from('lancamentos').select('*');

          if (compId === 'cozinha-brasileira') {
            queryProd = queryProd.or('company_id.eq.cozinha-brasileira,company_id.is.null');
            queryLanc = queryLanc.or('company_id.eq.cozinha-brasileira,company_id.is.null');
          } else {
            queryProd = queryProd.eq('company_id', compId);
            queryLanc = queryLanc.eq('company_id', compId);
          }

          const [resProd, resLanc, resFech] = await Promise.all([
            queryProd.order('nome'),
            queryLanc.order('data', { ascending: false }),
            supabaseClient.from('fechamentos').select('*').eq('company_id', compId).order('data_fechamento', { ascending: false })
          ]);

          if (resProd.data) {
            setProdutos(resProd.data);
            localStorage.setItem(`cache_prods_${compId}`, JSON.stringify(resProd.data));
          }
          if (resLanc.data) {
            setLancamentos(resLanc.data);
            localStorage.setItem(`cache_lancs_${compId}`, JSON.stringify(resLanc.data));
          }
          if (resFech.data) setHistoricoFechamentos(resFech.data);
        } catch (err) {
          console.error("Erro na sincronização:", err);
        }
      }

      const handleLogin = async (e) => {
        e.preventDefault();
        setAuthError('');
        const cleanUser = username.trim().toLowerCase();

        if (cleanUser === 'admin' && (password === 'admin123' || password === '123')) {
          const superAdminObj = { username: 'admin', role: 'superadmin', company_id: 'foodstrick-master', unidade: 'FoodStrick Master' };
          localStorage.setItem('foodstrick_master_session', JSON.stringify(superAdminObj));
          setCurrentUser(superAdminObj);
          setIsAuthenticated(true);
          setAbaAtiva('configuracoes');
          setSubAbaConfig('empresas');
          fetchCompanies();
          return;
        }

        if (cleanUser === 'cozinha' && password === '123') {
          let avatar = null;
          try {
            const { data } = await supabaseClient.from('app_users').select('avatar_url').eq('username', 'cozinha').maybeSingle();
            if (data) avatar = data.avatar_url;
          } catch(e){}

          const legacyObj = { username: 'cozinha', role: 'operador', company_id: 'cozinha-brasileira', unidade: 'Cozinha Brasileira', avatar_url: avatar };
          localStorage.setItem('foodstrick_master_session', JSON.stringify(legacyObj));
          setCurrentUser(legacyObj);
          setIsAuthenticated(true);
          setAbaAtiva('painel');
          return;
        }

        try {
          const { data: userData } = await supabaseClient.from('app_users').select('*').ilike('username', cleanUser).eq('password', password).maybeSingle();
          if (userData) {
            const { data: comp } = await supabaseClient.from('companies').select('*').eq('company_id', userData.company_id).maybeSingle();
            if (comp && comp.status === 'bloqueado') {
              setAuthError('Acesso bloqueado: este estabelecimento está suspenso.');
              return;
            }

            const userObj = { 
              username: userData.username, 
              role: userData.role || 'operador', 
              company_id: userData.company_id, 
              unidade: comp ? comp.company_name : 'Minha Cozinha', 
              avatar_url: userData.avatar_url 
            };
            localStorage.setItem('foodstrick_master_session', JSON.stringify(userObj));
            setCurrentUser(userObj);
            setIsAuthenticated(true);
            setAbaAtiva('painel');
            return;
          }
        } catch (err) {}

        setAuthError('Utilizador ou palavra-passe incorretos.');
      };

      const handleLogout = async () => {
        if (impersonatedCompany) await handleStopImpersonation();
        localStorage.removeItem('foodstrick_master_session');
        localStorage.removeItem('cache_prods');
        localStorage.removeItem('cache_lancs');
        setIsAuthenticated(false);
        setCurrentUser(null);
        setImpersonatedCompany(null);
        setAdminInsideNotification(null);
        setUsername(''); setPassword('');
        setProdutos([]); setLancamentos([]);
        setMobileMenuOpen(false);
      };

      const handleStartImpersonation = async (comp) => {
        try {
          await supabaseClient.from('app_users').update({ active_support_by: currentUser.username }).eq('company_id', comp.company_id);
          setImpersonatedCompany(comp);
          setAbaAtiva('painel');
          setMobileMenuOpen(false);
        } catch (err) {}
      };

      const handleStopImpersonation = async () => {
        if (impersonatedCompany) {
          try {
            await supabaseClient.from('app_users').update({ active_support_by: null }).eq('company_id', impersonatedCompany.company_id);
          } catch (err) {}
        }
        setImpersonatedCompany(null);
        setAbaAtiva('configuracoes');
        setSubAbaConfig('empresas');
      };

      // Cálculos Financeiros
      const lancamentosAtivos = useMemo(() => lancamentos.filter(l => l.status === 'ativo' || l.status === null), [lancamentos]);
      const lancamentosExcluidos = useMemo(() => lancamentos.filter(l => l.status === 'excluido'), [lancamentos]);

      const { faturamento, lucroProdutos, totalDespesas, resultadoMes, totalBebidas, totalPratos } = useMemo(() => {
        let fat = 0, lucroP = 0, desp = 0, beb = 0, pratos = 0;
        for (let i = 0; i < lancamentosAtivos.length; i++) {
          const l = lancamentosAtivos[i];
          const val = Number(l.valor_total) || 0;
          if (l.tipo === 'Venda') {
            fat += val;
            lucroP += (val - (Number(l.custo_total) || 0));
            if (l.canal_categoria === 'Bebidas') beb += Number(l.quantidade || 0);
            else pratos += Number(l.quantidade || 0);
          } else if (l.tipo === 'Despesa') {
            desp += val;
          }
        }
        return { faturamento: fat, lucroProdutos: lucroP, totalDespesas: desp, resultadoMes: lucroP - desp, totalBebidas: beb, totalPratos: pratos };
      }, [lancamentosAtivos]);

      const arrayIngredientes = useMemo(() => {
        const mapa = {};
        const prodsMap = new Map(produtos.map(p => [p.id, p]));
        lancamentosAtivos.forEach(venda => {
          if (venda.tipo !== 'Venda') return;
          const prod = prodsMap.get(venda.produto_id);
          if (prod && Array.isArray(prod.ingredientes)) {
            prod.ingredientes.forEach(ing => {
              const num = parseFloat(ing.quantidade) || 1;
              const totalQtd = num * Number(venda.quantidade || 1);
              const unidade = String(ing.quantidade).replace(/[0-9.,]/g, '').trim() || 'un';
              if (!mapa[ing.nome]) mapa[ing.nome] = { qtd: 0, unidade: unidade, custoTotal: 0 };
              mapa[ing.nome].qtd += totalQtd;
              mapa[ing.nome].custoTotal += (Number(ing.custo || 0) * Number(venda.quantidade || 1));
            });
          }
        });
        return Object.entries(mapa).sort((a, b) => b[1].qtd - a[1].qtd);
      }, [lancamentosAtivos, produtos]);

      async function handleSalvarLancamento(e) {
        e.preventDefault();
        const compTarget = effectiveCompanyId || 'cozinha-brasileira';
        let total = 0, custo = 0, desc = novoLancamento.descricao;

        if (novoLancamento.tipo === 'Venda') {
          const prod = produtos.find(p => p.id === novoLancamento.produto_id);
          if (!prod) return alert('Selecione um produto.');
          desc = prod.nome;
          total = Number(prod.preco_venda) * Number(novoLancamento.quantidade);
          custo = Number(prod.custo_unitario) * Number(novoLancamento.quantidade);
        } else {
          total = Number(novoLancamento.valor_despesa);
        }

        const payload = {
          company_id: compTarget, 
          data: novoLancamento.data, 
          tipo: novoLancamento.tipo,
          descricao: desc, 
          produto_id: novoLancamento.tipo === 'Venda' ? novoLancamento.produto_id : null,
          quantidade: novoLancamento.tipo === 'Venda' ? Number(novoLancamento.quantidade) : null,
          pagamento: novoLancamento.pagamento, 
          canal_categoria: novoLancamento.canal_categoria,
          valor_total: total, 
          custo_total: custo, 
          resultado: novoLancamento.tipo === 'Venda' ? total - custo : -total,
          fornecedor: novoLancamento.tipo === 'Despesa' ? novoLancamento.fornecedor : null, 
          status: 'ativo'
        };

        const { error } = await supabaseClient.from('lancamentos').insert([payload]);
        if (error) alert("Erro: " + error.message);
        else {
          carregarTudoEmParalelo(compTarget);
          setNovoLancamento({ ...novoLancamento, descricao: '', valor_despesa: '', quantidade: 1, produto_id: '', fornecedor: '' });
        }
      }

      async function confirmarExclusao() {
        if (!modalExclusao.idLancamento) return;
        const compTarget = effectiveCompanyId || 'cozinha-brasileira';
        const { error } = await supabaseClient.from('lancamentos').update({ status: 'excluido', motivo_exclusao: motivoExclusao }).eq('id', modalExclusao.idLancamento);
        if (error) alert("Erro: " + error.message);
        else { carregarTudoEmParalelo(compTarget); setModalExclusao({ aberto: false, idLancamento: null }); }
      }

      async function handleSalvarProduto(e) {
        e.preventDefault();
        const compTarget = effectiveCompanyId || 'cozinha-brasileira';
        const rawPreco = String(novoProduto.preco_venda).replace('R$', '').replace(/\s/g, '').replace(',', '.');
        const rawCusto = String(novoProduto.custo_unitario).replace('R$', '').replace(/\s/g, '').replace(',', '.');
        
        const payload = { 
          company_id: compTarget, 
          nome: novoProduto.nome.trim(), 
          preco_venda: parseFloat(rawPreco) || 0, 
          custo_unitario: parseFloat(rawCusto) || 0, 
          observacao: novoProduto.observacao ? novoProduto.observacao.trim() : '', 
          ingredientes: [] 
        };

        const { error } = await supabaseClient.from('produtos').insert([payload]);
        if (error) alert("Erro ao criar produto: " + error.message);
        else { 
          carregarTudoEmParalelo(compTarget); 
          setNovoProduto({ nome: '', preco_venda: '', custo_unitario: '', observacao: '' }); 
        }
      }

      // 1. EDIÇÃO DE PRODUTO (CORRIGIDA)
      async function handleAtualizarProduto(e) {
        e.preventDefault();
        const compTarget = effectiveCompanyId || 'cozinha-brasileira';
        const rawPreco = String(modalEditarProduto.preco_venda).replace('R$', '').replace(/\s/g, '').replace(',', '.');
        const rawCusto = String(modalEditarProduto.custo_unitario).replace('R$', '').replace(/\s/g, '').replace(',', '.');

        const payload = {
          nome: modalEditarProduto.nome.trim(),
          preco_venda: parseFloat(rawPreco) || 0,
          custo_unitario: parseFloat(rawCusto) || 0,
          observacao: modalEditarProduto.observacao ? modalEditarProduto.observacao.trim() : ''
        };

        const { error } = await supabaseClient.from('produtos').update(payload).eq('id', modalEditarProduto.id);
        if (error) {
          alert("Erro ao atualizar produto: " + error.message);
        } else {
          setProdutos(prev => prev.map(p => p.id === modalEditarProduto.id ? { ...p, ...payload } : p));
          setModalEditarProduto({ aberto: false, id: null, nome: '', preco_venda: '', custo_unitario: '', observacao: '' });
          carregarTudoEmParalelo(compTarget);
        }
      }

      // 2. ELIMINAÇÃO DE PRODUTO (CORRIGIDA)
      async function deletarProduto(id) {
        const compTarget = effectiveCompanyId || 'cozinha-brasileira';
        const { error } = await supabaseClient.from('produtos').delete().eq('id', id);
        if (error) {
          alert("Erro ao eliminar produto: " + error.message);
        } else {
          setProdutos(prev => prev.filter(p => p.id !== id));
          setModalExcluirProduto({ aberto: false, idProduto: null, nome: '' });
          carregarTudoEmParalelo(compTarget);
        }
      }

      // 3. ADIÇÃO DE INSUMO NA FICHA TÉCNICA (CORRIGIDA)
      async function handleAdicionarInsumo(e) {
        e.preventDefault();
        if (!modalFichaTecnica.produto) return;
        const prod = modalFichaTecnica.produto;
        let listaAtual = [];
        if (Array.isArray(prod.ingredientes)) {
          listaAtual = prod.ingredientes;
        } else if (typeof prod.ingredientes === 'string') {
          try { listaAtual = JSON.parse(prod.ingredientes); } catch(err) { listaAtual = []; }
        }

        const rawCusto = String(novoInsumo.custo).replace('R$', '').replace(/\s/g, '').replace(',', '.');
        const item = { 
          id: Date.now().toString(), 
          nome: novoInsumo.nome.trim(), 
          quantidade: novoInsumo.quantidade.trim(), 
          custo: parseFloat(rawCusto) || 0 
        };

        const novaLista = [...listaAtual, item];
        const novoCustoTotal = novaLista.reduce((acc, curr) => acc + (Number(curr.custo) || 0), 0);

        const { error } = await supabaseClient
          .from('produtos')
          .update({ ingredientes: novaLista, custo_unitario: novoCustoTotal })
          .eq('id', prod.id);

        if (error) {
          alert("Erro ao adicionar ingrediente: " + error.message);
        } else {
          const prodAtualizado = { ...prod, ingredientes: novaLista, custo_unitario: novoCustoTotal };
          setModalFichaTecnica({ aberto: true, produto: prodAtualizado });
          setProdutos(prev => prev.map(p => p.id === prod.id ? prodAtualizado : p));
          setNovoInsumo({ nome: '', quantidade: '', custo: '' });
          carregarTudoEmParalelo(effectiveCompanyId);
        }
      }

      // REMOÇÃO DE INSUMO NA FICHA TÉCNICA
      async function handleRemoverInsumo(insumoId) {
        if (!modalFichaTecnica.produto) return;
        const prod = modalFichaTecnica.produto;
        let listaAtual = Array.isArray(prod.ingredientes) ? prod.ingredientes : [];
        const novaLista = listaAtual.filter(i => i.id !== insumoId);
        const novoCustoTotal = novaLista.reduce((acc, curr) => acc + (Number(curr.custo) || 0), 0);

        const { error } = await supabaseClient
          .from('produtos')
          .update({ 
            ingredientes: novaLista, 
            custo_unitario: novaLista.length > 0 ? novoCustoTotal : prod.custo_unitario 
          })
          .eq('id', prod.id);

        if (error) {
          alert("Erro ao remover ingrediente: " + error.message);
        } else {
          const prodAtualizado = { 
            ...prod, 
            ingredientes: novaLista, 
            custo_unitario: novaLista.length > 0 ? novoCustoTotal : prod.custo_unitario 
          };
          setModalFichaTecnica({ aberto: true, produto: prodAtualizado });
          setProdutos(prev => prev.map(p => p.id === prod.id ? prodAtualizado : p));
          carregarTudoEmParalelo(effectiveCompanyId);
        }
      }

      async function handleExecutarFechamento() {
        if (lancamentosAtivos.length === 0) return alert("Não existem lançamentos ativos para fechar.");
        const dataAtual = new Date();
        const mesAno = `${dataAtual.getMonth() + 1}/${dataAtual.getFullYear()}`;
        if (!window.confirm(`Confirma o encerramento do mês ${mesAno}?\nO painel e os lançamentos serão zerados para o próximo ciclo.`)) return;

        setProcessandoFechamento(true);
        const compTarget = effectiveCompanyId || 'cozinha-brasileira';

        await supabaseClient.from('fechamentos').insert([{ 
          company_id: compTarget, 
          mes_ano: mesAno, 
          relatorio: { faturamento, despesas: totalDespesas, lucro: resultadoMes, totalPratos, totalBebidas, ingredientes: arrayIngredientes, totalRegistros: lancamentosAtivos.length } 
        }]);

        const ids = lancamentosAtivos.map(l => l.id);
        await supabaseClient.from('lancamentos').update({ status: 'arquivado' }).in('id', ids);

        alert("Fechamento concluído com sucesso!");
        carregarTudoEmParalelo(compTarget);
        setProcessandoFechamento(false);
      }

      const fetchCompanies = async () => {
        const { data } = await supabaseClient.from('companies').select('*').order('created_at', { ascending: false });
        if (data) setCompaniesList(data);
      };

      const handleCreateCompanyB2B = async (e) => {
        e.preventDefault();
        const cleanName = newCompanyName.trim();
        let cleanSlug = newCompanySlug.trim().toLowerCase().replace(/[^a-z0-9-]/g, '-');

        await supabaseClient.from('companies').insert([{ company_id: cleanSlug, company_name: cleanName, contact_phone: newCompanyPhone.trim(), status: 'ativo' }]);
        await supabaseClient.from('app_users').insert([{ username: newCompanyAdminUser.trim().toLowerCase(), password: newCompanyAdminPass.trim(), role: 'admin', company_id: cleanSlug }]);

        alert(`Restaurante "${cleanName}" registrado!`);
        setNewCompanyName(''); setNewCompanySlug(''); setNewCompanyPhone(''); setNewCompanyAdminUser(''); setNewCompanyAdminPass('');
        fetchCompanies();
      };

      const handleToggleCompanyStatus = async (id, currentStatus) => {
        await supabaseClient.from('companies').update({ status: currentStatus === 'ativo' ? 'bloqueado' : 'ativo' }).eq('id', id);
        fetchCompanies();
      };

      const handleAvatarUpload = (e) => {
        const file = e.target.files[0];
        if (!file || !currentUser) return;
        const reader = new FileReader();
        reader.onload = (event) => {
          const img = new Image();
          img.onload = async () => {
            const canvas = document.createElement('canvas');
            const maxSize = 250;
            let width = img.width, height = img.height;
            if (width > height) { if (width > maxSize) { height = Math.round((height * maxSize) / width); width = maxSize; } }
            else { if (height > maxSize) { width = Math.round((width * maxSize) / height); height = maxSize; } }
            canvas.width = width; canvas.height = height;
            canvas.getContext('2d').drawImage(img, 0, 0, width, height);
            const compressedBase64 = canvas.toDataURL('image/jpeg', 0.85);
            
            const updatedUser = { ...currentUser, avatar_url: compressedBase64 };
            setCurrentUser(updatedUser);
            localStorage.setItem('foodstrick_master_session', JSON.stringify(updatedUser));
            await supabaseClient.from('app_users').update({ avatar_url: compressedBase64 }).eq('username', currentUser.username);
          };
          img.src = event.target.result;
        };
        reader.readAsDataURL(file);
      };

      const handleRemoveAvatar = async () => {
        if (!currentUser) return;
        const updatedUser = { ...currentUser, avatar_url: null };
        setCurrentUser(updatedUser);
        localStorage.setItem('foodstrick_master_session', JSON.stringify(updatedUser));
        await supabaseClient.from('app_users').update({ avatar_url: null }).eq('username', currentUser.username);

      const isSupportSessionActive = Boolean(impersonatedCompany || adminInsideNotification);

      const navegarPara = (aba) => {
        setAbaAtiva(aba);
        setMobileMenuOpen(false);

      // ==========================

      if (!isAuthenticated) {
        return (
          <div className="min-h-screen w-full flex items-center justify-center md:justify-start p-4 sm:p-6 md:p-16 lg:p-24 relative bg-cover bg-center" style={{ backgroundImage: `url("${LOGIN_BG_IMAGE}")` }}>
            <div className="absolute inset-0 bg-black/75 backdrop-blur-sm" />

              <div className="flex items-center gap-3 pb-5 border-b border-[#2d2d2d] mb-5">
                <div className="w-12 h-12 rounded-xl bg-[#D95B1E] flex items-center justify-center text-white shadow-lg shadow-[#D95B1E]/30 shrink-0">
                  <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"/></svg>
                </div>
                <div>
                  <h1 className="text-xl sm:text-2xl font-black italic tracking-wider text-white">FoodStrick</h1>
                  <p className="text-[10px] text-[#D95B1E] font-bold uppercase tracking-widest">SaaS Master Access</p>
                </div>
              </div>
              {authError && <div className="mb-4 p-3 bg-red-950/60 border border-red-800 text-red-300 rounded-lg text-xs font-medium text-center">{authError}</div>}
              <form onSubmit={handleLogin} className="space-y-4">
                <div>
                  <label className="block text-xs font-medium text-zinc-400 mb-1">Usuário</label>
                  <input type="text" placeholder="admin ou cozinha" value={username} onChange={(e) => setUsername(e.target.value)} className="w-full bg-[#202020] text-white text-base md:text-sm px-4 py-3 md:py-2.5 rounded-lg border border-[#333] focus:border-[#D95B1E] outline-none" required />
                </div>
                <div className="relative">
                  <label className="block text-xs font-medium text-zinc-400 mb-1">Senha</label>
                  <input type={showPassword ? "text" : "password"} placeholder="••••••••" value={password} onChange={(e) => setPassword(e.target.value)} className="w-full bg-[#202020] text-white text-base md:text-sm px-4 py-3 md:py-2.5 pr-10 rounded-lg border border-[#333] focus:border-[#D95B1E] outline-none" required />
                  <button type="button" onClick={() => setShowPassword(!showPassword)} className="absolute right-3 top-8 md:top-8 text-zinc-400 hover:text-white p-1">
                    {showPassword ? (
                      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/><path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/><path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/><line x1="2" x2="22" y1="2" y2="22"/></svg>

      // SISTEMA PRINCIPAL
      return (

            <div className="flex items-center gap-2.5">
              <div className="w-8 h-8 rounded-lg bg-[#D95B1E] flex items-center justify-center text-white shadow-sm">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"/></svg>
              </div>
              <div className="overflow-hidden">
                <span className="text-sm font-black text-white block leading-tight">FoodStrick</span>
                <span className="text-[10px] text-zinc-400 font-semibold uppercase tracking-wider block truncate max-w-[170px]">{effectiveCompanyName}</span>

            </div>

            <button onClick={() => setMobileMenuOpen(!mobileMenuOpen)} className="p-2 text-zinc-300 hover:text-white bg-[#202020] border border-[#333] rounded-lg transition-colors" title="Menu">
              {mobileMenuOpen ? (

                              <td className="py-2.5 text-white font-mono">R$ {Number(p.preco_venda).toFixed(2)}</td>
                              <td className="py-2.5 font-mono">R$ {Number(p.custo_unitario).toFixed(2)}</td>
                              <td className="py-2.5 font-bold text-emerald-400 font-mono">R$ {margem.toFixed(2)}</td>

                              <span className="font-bold text-white text-sm sm:text-base">{currentUser?.username}</span>
                            </div>
                            <div className="bg-[#1f1f1f] border border-[#2d2d2d] rounded-xl p-3.5">
                              <span className="text-[10px] uppercase font-bold text-zinc-500 block mb-0.5">Função</span>
                              <span className="font-bold text-[#D95B1E] uppercase text-sm sm:text-base">{currentUser?.role}</span>
                            </div>
                          </div>
                          <div className="bg-[#1f1f1f] border border-[#2d2d2d] rounded-xl p-3.5">
                            <span className="text-[10px] uppercase font-bold text-zinc-500 block mb-0.5">Unidade Ativa</span>
                            <span className="font-bold text-white text-sm sm:text-lg block truncate">{effectiveCompanyName}</span>
                          </div>
                        </div>
                      </div>
                    </div>
                  </div>
                )}
              </div>
            )}
          </main>

          {/* CURSOR MULTIPLAYER */}
          {isSupportSessionActive && (
            <LiveCursor 
              companyId={effectiveCompanyId}
              currentUsername={currentUser?.username}
              currentUserRole={currentUser?.role}
              targetUsername={isSuperAdmin ? 'cozinha' : 'admin'}
              isActive={isSupportSessionActive}
              supabaseClient={supabaseClient}
            />
          )}

          {/* CHAT DE SUPORTE */}
          {isSupportSessionActive && (
            <SupportChat 
              companyId={effectiveCompanyId}
              currentUsername={currentUser?.username}
              currentUserRole={currentUser?.role}
              operatorUsername={isSuperAdmin ? 'cozinha' : currentUser?.username}
              isVisible={isSupportSessionActive}
              supabaseClient={supabaseClient}
            />
          )}

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
