<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FoodStrick | Gestão Master</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body { background-color: #0f0f0f; color: #f5f5f5; font-family: sans-serif; }
    .btn-orange { background-color: #D95B1E; color: white; }
    .btn-orange:hover { background-color: #c34e17; }
    
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #333; border-radius: 10px; }
    ::-webkit-scrollbar-thumb:hover { background: #555; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;
    
    // CREDENCIAIS DO SUPABASE
    const SUPABASE_URL = 'https://ddngvelrtqmfgaeqsjem.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_EhLCuypZr6vHrSKDCrHxQg_n7BvKxBU';
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const LOGIN_BG_IMAGE = "https://images.unsplash.com/photo-1555396273-367ea4eb4db5?q=80&w=1920&auto=format&fit=crop";

    function App() {
      const [isAuthenticated, setIsAuthenticated] = useState(false);
      const [currentUser, setCurrentUser] = useState(null);

      // Modo Suporte B2B
      const [impersonatedCompany, setImpersonatedCompany] = useState(null);

      // Login
      const [username, setUsername] = useState('');
      const [password, setPassword] = useState('');
      const [showPassword, setShowPassword] = useState(false);
      const [authError, setAuthError] = useState('');

      // Navegação Principal
      const [abaAtiva, setAbaAtiva] = useState('painel'); 
      const [subAbaConfig, setSubAbaConfig] = useState('conta'); 

      // Dados Operacionais
      const [produtos, setProdutos] = useState([]);
      const [lancamentos, setLancamentos] = useState([]);
      const [historicoFechamentos, setHistoricoFechamentos] = useState([]);
      const [carregando, setCarregando] = useState(false);
      const [processandoFechamento, setProcessandoFechamento] = useState(false);

      // Modais
      const [modalExclusao, setModalExclusao] = useState({ aberto: false, idLancamento: null });
      const [motivoExclusao, setMotivoExclusao] = useState('Pedido cancelado');
      const [modalExcluirProduto, setModalExcluirProduto] = useState({ aberto: false, idProduto: null, nome: '' });
      
      const [modalEditarProduto, setModalEditarProduto] = useState({
        aberto: false, id: null, nome: '', preco_venda: '', custo_unitario: '', observacao: ''
      });

      const [modalFichaTecnica, setModalFichaTecnica] = useState({
        aberto: false, produto: null
      });
      const [novoInsumo, setNovoInsumo] = useState({
        nome: '', quantidade: '', custo: ''
      });

      // Formulários
      const [novoLancamento, setNovoLancamento] = useState({
        data: new Date().toISOString().split('T')[0],
        tipo: 'Venda', produto_id: '', descricao: '', quantidade: 1, 
        pagamento: 'Pix', canal_categoria: 'Delivery', valor_despesa: '', fornecedor: ''
      });

      const [novoProduto, setNovoProduto] = useState({
        nome: '', preco_venda: '', custo_unitario: '', observacao: ''
      });

      // Gestão Master (B2B)
      const [companiesList, setCompaniesList] = useState([]);
      const [newCompanyName, setNewCompanyName] = useState('');
      const [newCompanySlug, setNewCompanySlug] = useState('');
      const [newCompanyPhone, setNewCompanyPhone] = useState('');
      const [newCompanyAdminUser, setNewCompanyAdminUser] = useState('');
      const [newCompanyAdminPass, setNewCompanyAdminPass] = useState('');

      const avatarInputRef = useRef(null);

      const isSuperAdmin = currentUser?.role === 'superadmin';
      const effectiveCompanyId = impersonatedCompany ? impersonatedCompany.company_id : currentUser?.company_id;
      const effectiveCompanyName = impersonatedCompany ? impersonatedCompany.company_name : (currentUser?.unidade || 'FoodStrick');

      useEffect(() => {
        const saved = localStorage.getItem('foodstrick_master_session');
        if (saved) {
          try {
            const parsed = JSON.parse(saved);
            setCurrentUser(parsed);
            setIsAuthenticated(true);
            if (parsed.role === 'superadmin') {
              setAbaAtiva('configuracoes');
              setSubAbaConfig('empresas');
              fetchCompanies();
            }
          } catch (e) {}
        }
      }, []);

      useEffect(() => {
        if (isAuthenticated && effectiveCompanyId && effectiveCompanyId !== 'foodstrick-master') {
          carregarDadosOperacionais(effectiveCompanyId);
          carregarHistoricoFechamentos(effectiveCompanyId);
        }
      }, [isAuthenticated, effectiveCompanyId]);

      async function carregarDadosOperacionais(compId) {
        setCarregando(true);
        try {
          let prodsData = [];
          let lancsData = [];

          const resProd = await supabaseClient
            .from('produtos')
            .select('*')
            .or(`company_id.eq.${compId},company_id.eq.cozinha-brasileira,company_id.is.null`)
            .order('nome');

          const resLanc = await supabaseClient
            .from('lancamentos')
            .select('*')
            .or(`company_id.eq.${compId},company_id.eq.cozinha-brasileira,company_id.is.null`)
            .order('data', { ascending: false });

          if (!resProd.error && resProd.data) prodsData = resProd.data;
          else {
            const fallbackProd = await supabaseClient.from('produtos').select('*').order('nome');
            if (fallbackProd.data) prodsData = fallbackProd.data;
          }

          if (!resLanc.error && resLanc.data) lancsData = resLanc.data;
          else {
            const fallbackLanc = await supabaseClient.from('lancamentos').select('*').order('data', { ascending: false });
            if (fallbackLanc.data) lancsData = fallbackLanc.data;
          }

          setProdutos(prodsData);
          setLancamentos(lancsData);
        } catch (err) {
          console.error("Erro no carregamento:", err);
        }
        setCarregando(false);
      }

      async function carregarHistoricoFechamentos(compId) {
        try {
          const { data } = await supabaseClient
            .from('fechamentos')
            .select('*')
            .eq('company_id', compId)
            .order('data_fechamento', { ascending: false });
          if (data) setHistoricoFechamentos(data);
        } catch (err) {}
      }

      // --- AUTENTICAÇÃO ---
      const handleLogin = async (e) => {
        e.preventDefault();
        setAuthError('');
        const cleanUser = username.trim().toLowerCase();

        if (cleanUser === 'admin' && (password === 'admin123' || password === '123')) {
          const superAdminObj = { username: 'Super Admin', role: 'superadmin', company_id: 'foodstrick-master', unidade: 'FoodStrick Master' };
          localStorage.setItem('foodstrick_master_session', JSON.stringify(superAdminObj));
          setCurrentUser(superAdminObj);
          setIsAuthenticated(true);
          setAbaAtiva('configuracoes');
          setSubAbaConfig('empresas');
          fetchCompanies();
          return;
        }

        if (cleanUser === 'cozinha' && password === '123') {
          let avatar = null;
          try {
            const { data } = await supabaseClient.from('app_users').select('avatar_url').eq('username', 'cozinha').maybeSingle();
            if (data) avatar = data.avatar_url;
          } catch(e){}

          const legacyObj = { username: 'Admin Cozinha', role: 'admin', company_id: 'cozinha-brasileira', unidade: 'Cozinha Brasileira', avatar_url: avatar };
          localStorage.setItem('foodstrick_master_session', JSON.stringify(legacyObj));
          setCurrentUser(legacyObj);
          setIsAuthenticated(true);
          setAbaAtiva('painel');
          return;
        }

        try {
          const { data: userData } = await supabaseClient
            .from('app_users')
            .select('*')
            .ilike('username', cleanUser)
            .eq('password', password)
            .maybeSingle();

          if (userData) {
            const { data: comp } = await supabaseClient.from('companies').select('*').eq('company_id', userData.company_id).maybeSingle();
            if (comp && comp.status === 'bloqueado') {
              setAuthError('Acesso bloqueado: este estabelecimento está suspenso.');
              return;
            }

            const userObj = { 
              username: userData.username, 
              role: userData.role || 'operador', 
              company_id: userData.company_id,
              unidade: comp ? comp.company_name : 'Minha Cozinha',
              avatar_url: userData.avatar_url
            };
            localStorage.setItem('foodstrick_master_session', JSON.stringify(userObj));
            setCurrentUser(userObj);
            setIsAuthenticated(true);
            setAbaAtiva('painel');
            return;
          }
        } catch (err) {}

        setAuthError('Utilizador ou palavra-passe incorretos.');
      };

      const handleLogout = () => {
        localStorage.removeItem('foodstrick_master_session');
        setIsAuthenticated(false);
        setCurrentUser(null);
        setImpersonatedCompany(null);
        setUsername(''); setPassword('');
        setProdutos([]); setLancamentos([]);
      };

      // Cálculos Financeiros (Apenas os que não foram arquivados ou excluídos)
      const lancamentosAtivos = lancamentos.filter(l => l.status === 'ativo' || l.status === null);
      const lancamentosExcluidos = lancamentos.filter(l => l.status === 'excluido');

      const faturamento = lancamentosAtivos.filter(l => l.tipo === 'Venda').reduce((acc, curr) => acc + Number(curr.valor_total), 0);
      const lucroProdutos = lancamentosAtivos.filter(l => l.tipo === 'Venda').reduce((acc, curr) => acc + (Number(curr.valor_total) - Number(curr.custo_total)), 0);
      const totalDespesas = lancamentosAtivos.filter(l => l.tipo === 'Despesa').reduce((acc, curr) => acc + Number(curr.valor_total), 0);
      const resultadoMes = lucroProdutos - totalDespesas;

      // Cálculos para o Fechamento Mensal
      const totalBebidas = lancamentosAtivos.filter(l => l.tipo === 'Venda' && l.canal_categoria === 'Bebidas').reduce((acc, curr) => acc + Number(curr.quantidade || 0), 0);
      const totalPratos = lancamentosAtivos.filter(l => l.tipo === 'Venda' && l.canal_categoria !== 'Bebidas').reduce((acc, curr) => acc + Number(curr.quantidade || 0), 0);

      let ingredientesUsados = {};
      lancamentosAtivos.filter(l => l.tipo === 'Venda').forEach(venda => {
        const prod = produtos.find(p => p.id === venda.produto_id);
        if (prod && Array.isArray(prod.ingredientes)) {
          prod.ingredientes.forEach(ing => {
            const num = parseFloat(ing.quantidade) || 1;
            const totalQtd = num * Number(venda.quantidade || 1);
            const unidade = String(ing.quantidade).replace(/[0-9.,]/g, '').trim() || 'un';
            
            if (!ingredientesUsados[ing.nome]) {
              ingredientesUsados[ing.nome] = { qtd: 0, unidade: unidade, custoTotal: 0 };
            }
            ingredientesUsados[ing.nome].qtd += totalQtd;
            ingredientesUsados[ing.nome].custoTotal += (Number(ing.custo || 0) * Number(venda.quantidade || 1));
          });
        }
      });
      const arrayIngredientes = Object.entries(ingredientesUsados).sort((a, b) => b[1].qtd - a[1].qtd);

      async function handleSalvarLancamento(e) {
        e.preventDefault();
        const compTarget = effectiveCompanyId || 'cozinha-brasileira';
        let total = 0, custo = 0, desc = novoLancamento.descricao;

        if (novoLancamento.tipo === 'Venda') {
          const prod = produtos.find(p => p.id === novoLancamento.produto_id);
          if (!prod) return alert('Selecione um produto.');
          desc = prod.nome;
          total = Number(prod.preco_venda) * Number(novoLancamento.quantidade);
          custo = Number(prod.custo_unitario) * Number(novoLancamento.quantidade);
        } else {
          total = Number(novoLancamento.valor_despesa);
        }

        const payload = {
          company_id: compTarget,
          data: novoLancamento.data, 
          tipo: novoLancamento.tipo,
          descricao: desc, 
          produto_id: novoLancamento.tipo === 'Venda' ? novoLancamento.produto_id : null,
          quantidade: novoLancamento.tipo === 'Venda' ? Number(novoLancamento.quantidade) : null,
          pagamento: novoLancamento.pagamento, 
          canal_categoria: novoLancamento.canal_categoria,
          valor_total: total, 
          custo_total: custo, 
          resultado: novoLancamento.tipo === 'Venda' ? total - custo : -total,
          fornecedor: novoLancamento.tipo === 'Despesa' ? novoLancamento.fornecedor : null, 
          status: 'ativo'
        };

        const { error } = await supabaseClient.from('lancamentos').insert([payload]);
        if (error) alert("Erro: " + error.message);
        else {
          carregarDadosOperacionais(compTarget);
          setNovoLancamento({ ...novoLancamento, descricao: '', valor_despesa: '', quantidade: 1, produto_id: '', fornecedor: '' });
        }
      }

      async function confirmarExclusao() {
        if (!modalExclusao.idLancamento) return;
        const compTarget = effectiveCompanyId || 'cozinha-brasileira';
        const { error } = await supabaseClient.from('lancamentos').update({ status: 'excluido', motivo_exclusao: motivoExclusao }).eq('id', modalExclusao.idLancamento);
        if (error) alert("Erro: " + error.message);
        else { carregarDadosOperacionais(compTarget); setModalExclusao({ aberto: false, idLancamento: null }); }
      }

      async function handleSalvarProduto(e) {
        e.preventDefault();
        const compTarget = effectiveCompanyId || 'cozinha-brasileira';
        const payload = {
          company_id: compTarget, 
          nome: novoProduto.nome,
          preco_venda: parseFloat(novoProduto.preco_venda), 
          custo_unitario: parseFloat(novoProduto.custo_unitario), 
          observacao: novoProduto.observacao,
          ingredientes: []
        };
        const { error } = await supabaseClient.from('produtos').insert([payload]);
        if (error) alert("Erro: " + error.message);
        else { carregarDadosOperacionais(compTarget); setNovoProduto({ nome: '', preco_venda: '', custo_unitario: '', observacao: '' }); }
      }

      async function handleAtualizarProduto(e) {
        e.preventDefault();
        const compTarget = effectiveCompanyId || 'cozinha-brasileira';
        const payload = {
          nome: modalEditarProduto.nome,
          preco_venda: parseFloat(modalEditarProduto.preco_venda),
          custo_unitario: parseFloat(modalEditarProduto.custo_unitario),
          observacao: modalEditarProduto.observacao
        };

        const { error } = await supabaseClient.from('produtos').update(payload).eq('id', modalEditarProduto.id);
        if (error) alert("Erro ao atualizar produto: " + error.message);
        else {
          carregarDadosOperacionais(compTarget);
          setModalEditarProduto({ aberto: false, id: null, nome: '', preco_venda: '', custo_unitario: '', observacao: '' });
        }
      }

      async function deletarProduto(id) {
        const compTarget = effectiveCompanyId || 'cozinha-brasileira';
        const temLancamentos = lancamentos.some(l => l.produto_id === id);
        if (temLancamentos) {
          alert("Atenção: Este produto já possui vendas registadas e não pode ser apagado para manter os relatórios corretos.");
          setModalExcluirProduto({ aberto: false, idProduto: null, nome: '' });
          return;
        }
        const { error } = await supabaseClient.from('produtos').delete().eq('id', id);
        if (error) alert("Erro: " + error.message);
        else { carregarDadosOperacionais(compTarget); setModalExcluirProduto({ aberto: false, idProduto: null, nome: '' }); }
      }

      async function handleAdicionarInsumo(e) {
        e.preventDefault();
        if (!modalFichaTecnica.produto) return;
        const prod = modalFichaTecnica.produto;
        const listaAtual = Array.isArray(prod.ingredientes) ? prod.ingredientes : [];
        
        const item = {
          id: Date.now().toString(),
          nome: novoInsumo.nome.trim(),
          quantidade: novoInsumo.quantidade.trim(),
          custo: parseFloat(novoInsumo.custo) || 0
        };

        const novaLista = [...listaAtual, item];
        const novoCustoTotal = novaLista.reduce((acc, curr) => acc + Number(curr.custo || 0), 0);

        const { error } = await supabaseClient
          .from('produtos')
          .update({ 
            ingredientes: novaLista,
            custo_unitario: novoCustoTotal 
          })
          .eq('id', prod.id);

        if (error) {
          alert("Erro ao adicionar ingrediente: " + error.message);
        } else {
          const prodAtualizado = { ...prod, ingredientes: novaLista, custo_unitario: novoCustoTotal };
          setModalFichaTecnica({ aberto: true, produto: prodAtualizado });
          setNovoInsumo({ nome: '', quantidade: '', custo: '' });
          carregarDadosOperacionais(effectiveCompanyId);
        }
      }

      async function handleRemoverInsumo(insumoId) {
        if (!modalFichaTecnica.produto) return;
        const prod = modalFichaTecnica.produto;
        const listaAtual = Array.isArray(prod.ingredientes) ? prod.ingredientes : [];
        const novaLista = listaAtual.filter(i => i.id !== insumoId);
        const novoCustoTotal = novaLista.reduce((acc, curr) => acc + Number(curr.custo || 0), 0);

        const { error } = await supabaseClient
          .from('produtos')
          .update({ 
            ingredientes: novaLista,
            custo_unitario: novaLista.length > 0 ? novoCustoTotal : prod.custo_unitario 
          })
          .eq('id', prod.id);

        if (error) {
          alert("Erro ao remover ingrediente: " + error.message);
        } else {
          const prodAtualizado = { 
            ...prod, 
            ingredientes: novaLista, 
            custo_unitario: novaLista.length > 0 ? novoCustoTotal : prod.custo_unitario 
          };
          setModalFichaTecnica({ aberto: true, produto: prodAtualizado });
          carregarDadosOperacionais(effectiveCompanyId);
        }
      }

      // Execução do Fechamento Mensal
      async function handleExecutarFechamento() {
        if (lancamentosAtivos.length === 0) {
          return alert("Não existem lançamentos ativos para fechar neste momento.");
        }

        const dataAtual = new Date();
        const mesAno = `${dataAtual.getMonth() + 1}/${dataAtual.getFullYear()}`;
        const confirmacao = window.confirm(`Confirma o encerramento das contas de ${mesAno}?\nOs lançamentos atuais serão arquivados para iniciar o próximo ciclo com o painel zerado.`);
        
        if (!confirmacao) return;
        setProcessandoFechamento(true);

        const relatorioCompleto = {
          faturamento,
          despesas,
          lucro: resultadoMes,
          totalPratos,
          totalBebidas,
          ingredientes: arrayIngredientes,
          totalRegistros: lancamentosAtivos.length
        };

        const compTarget = effectiveCompanyId || 'cozinha-brasileira';

        const { error: errInsert } = await supabaseClient.from('fechamentos').insert([{
          company_id: compTarget,
          mes_ano: mesAno,
          relatorio: relatorioCompleto
        }]);

        if (errInsert) {
          alert("Erro ao registar fechamento: " + errInsert.message);
          setProcessandoFechamento(false);
          return;
        }

        const idsParaArquivar = lancamentosAtivos.map(l => l.id);
        const { error: errUpdate } = await supabaseClient
          .from('lancamentos')
          .update({ status: 'arquivado' })
          .in('id', idsParaArquivar);

        if (errUpdate) {
          alert("Erro ao arquivar lançamentos: " + errUpdate.message);
        } else {
          alert("Fechamento do mês concluído com sucesso! O painel e lançamentos foram zerados.");
          carregarDadosOperacionais(compTarget);
          carregarHistoricoFechamentos(compTarget);
        }
        setProcessandoFechamento(false);
      }

      // Gestão B2B
      const fetchCompanies = async () => {
        const { data } = await supabaseClient.from('companies').select('*').order('created_at', { ascending: false });
        if (data) setCompaniesList(data);
      };

      const handleCreateCompanyB2B = async (e) => {
        e.preventDefault();
        const cleanName = newCompanyName.trim();
        let cleanSlug = newCompanySlug.trim().toLowerCase().replace(/[^a-z0-9-]/g, '-');
        const cleanAdmin = newCompanyAdminUser.trim().toLowerCase();
        
        if (!cleanSlug) cleanSlug = cleanName.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-z0-9]+/g, '-');

        const { error: compError } = await supabaseClient.from('companies').insert([
          { company_id: cleanSlug, company_name: cleanName, contact_phone: newCompanyPhone.trim(), status: 'ativo' }
        ]);
        if (compError) return alert("Erro ao criar empresa: " + compError.message);

        await supabaseClient.from('app_users').insert([
          { username: cleanAdmin, password: newCompanyAdminPass.trim(), role: 'admin', company_id: cleanSlug }
        ]);

        alert(`Restaurante "${cleanName}" registado com sucesso!`);
        setNewCompanyName(''); setNewCompanySlug(''); setNewCompanyPhone(''); setNewCompanyAdminUser(''); setNewCompanyAdminPass('');
        fetchCompanies();
      };

      const handleToggleCompanyStatus = async (id, currentStatus) => {
        const nextStatus = currentStatus === 'ativo' ? 'bloqueado' : 'ativo';
        await supabaseClient.from('companies').update({ status: nextStatus }).eq('id', id);
        fetchCompanies();
      };

      // Foto de Perfil
      const handleAvatarUpload = (e) => {
        const file = e.target.files[0];
        if (!file || !currentUser) return;

        const reader = new FileReader();
        reader.onload = (event) => {
          const img = new Image();
          img.onload = async () => {
            const canvas = document.createElement('canvas');
            const maxSize = 250;
            let width = img.width;
            let height = img.height;

            if (width > height) {
              if (width > maxSize) { height = Math.round((height * maxSize) / width); width = maxSize; }
            } else {
              if (height > maxSize) { width = Math.round((width * maxSize) / height); height = maxSize; }
            }

            canvas.width = width; canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);

            const compressedBase64 = canvas.toDataURL('image/jpeg', 0.85);
            const updatedUser = { ...currentUser, avatar_url: compressedBase64 };
            
            setCurrentUser(updatedUser);
            localStorage.setItem('foodstrick_master_session', JSON.stringify(updatedUser));

            if(currentUser.username === 'Admin Cozinha' || currentUser.username === 'cozinha') {
              await supabaseClient.from('app_users').update({ avatar_url: compressedBase64 }).eq('username', 'cozinha');
            } else {
              await supabaseClient.from('app_users').update({ avatar_url: compressedBase64 }).eq('username', currentUser.username);
            }
          };
          img.src = event.target.result;
        };
        reader.readAsDataURL(file);
      };

      const handleRemoveAvatar = async () => {
        if (!currentUser) return;
        const updatedUser = { ...currentUser, avatar_url: null };
        setCurrentUser(updatedUser);
        localStorage.setItem('foodstrick_master_session', JSON.stringify(updatedUser));

        if(currentUser.username === 'Admin Cozinha' || currentUser.username === 'cozinha') {
          await supabaseClient.from('app_users').update({ avatar_url: null }).eq('username', 'cozinha');
        } else {
          await supabaseClient.from('app_users').update({ avatar_url: null }).eq('username', currentUser.username);
        }
      };

      // ==========================

                          </div>

                          Concluir Ficha Técnica

                            <td className="py-3">R$ {Number(p.custo_unitario).toFixed(2)}</td>
                            <td className="py-3 font-bold text-emerald-400">R$ {margem.toFixed(2)}</td>
                            <td className="py-3 text-zinc-300">{pct}%</td>
                            <td className="py-3 text-right pr-4">
                              <div className="flex items-center justify-end gap-1.5">
                                <button 
                                  onClick={() => setModalFichaTecnica({ aberto: true, produto: p })}
                                  className="p-1.5 text-zinc-400 hover:text-emerald-400 hover:bg-emerald-400/10 rounded transition-colors"
                                  title="Ver / Adicionar Ingredientes e Ficha Técnica"
                                >
                                  <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><rect width="8" height="4" x="8" y="2" rx="1" ry="1"/><path d="M9 12h6"/><path d="M9 16h6"/></svg>
                                </button>
                                <button 
                                  onClick={() => setModalEditarProduto({
                                    aberto: true,
                                    id: p.id,
                                    nome: p.nome,
                                    preco_venda: p.preco_venda,
                                    custo_unitario: p.custo_unitario,
                                    observacao: p.observacao || ''
                                  })} 
                                  className="p-1.5 text-zinc-400 hover:text-amber-400 hover:bg-amber-400/10 rounded transition-colors"
                                  title="Editar Produto e Preço"
                                >
                                  <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/><path d="m15 5 4 4"/></svg>
                                </button>
                                <button 
                                  onClick={() => setModalExcluirProduto({ aberto: true, idProduto: p.id, nome: p.nome })} 
                                  className="p-1.5 text-zinc-400 hover:text-red-400 hover:bg-red-400/10 rounded transition-colors"
                                  title="Eliminar Produto"
                                >
                                  <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/><line x1="10" x2="10" y1="11" y2="17"/><line x1="14" x2="14" y1="11" y2="17"/></svg>
                                </button>
                              </div>
                            </td>
                          </tr>
                        );
                      })}
                    </tbody>
                  </table>
                </div>
              </div>
            )}

            {/* 4. ABA FICHAS TÉCNICAS */}
            {abaAtiva === 'fichas' && (!isSuperAdmin || impersonatedCompany) && (
              <div className="max-w-6xl">
                <header className="mb-6">
                  <h1 className="text-2xl font-bold text-white">Central de Fichas Técnicas</h1>
                  <p className="text-xs text-zinc-400">Controlo minucioso de cada insumo, pesagem e custo real por porção</p>
                </header>

                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                  {produtos.map(p => {
                    const ingList = Array.isArray(p.ingredientes) ? p.ingredientes : [];
                    const somaCusto = ingList.reduce((acc, curr) => acc + Number(curr.custo || 0), 0);
                    const custoFinal = ingList.length > 0 ? somaCusto : Number(p.custo_unitario || 0);
                    const preco = Number(p.preco_venda || 0);
                    const margem = preco - custoFinal;

                    return (
                      <div key={p.id} className="bg-[#161616] border border-[#262626] rounded-xl p-5 flex flex-col justify-between hover:border-zinc-700 transition-colors">
                        <div>
                          <div className="flex items-start justify-between mb-3">
                            <div>
                              <h3 className="text-base font-bold text-white">{p.nome}</h3>
                              <span className="text-[11px] text-zinc-500">{ingList.length} ingredientes na ficha</span>
                            </div>
                            <span className="text-xs font-mono font-bold text-emerald-400 bg-emerald-950/60 px-2 py-0.5 rounded border border-emerald-900/60">
                              R$ {custoFinal.toFixed(2)}
                            </span>
                          </div>

                          <div className="bg-[#1f1f1f] rounded-lg p-3 my-3 space-y-1.5 text-xs text-zinc-300">
                            {ingList.length === 0 ? (
                              <p className="text-zinc-500 italic text-[11px]">Nenhum ingrediente adicionado ainda.</p>
                            ) : (
                              ingList.slice(0, 3).map((item, idx) => (
                                <div key={idx} className="flex justify-between text-[11px]">
                                  <span className="text-zinc-400 truncate max-w-[140px]">{item.nome} ({item.quantidade})</span>
                                  <span className="text-white font-mono">R$ {Number(item.custo).toFixed(2)}</span>
                                </div>
                              ))
                            )}
                            {ingList.length > 3 && (
                              <p className="text-[10px] text-zinc-500 pt-1">+ {ingList.length - 3} outros insumos...</p>
                            )}
                          </div>
                        </div>

                        <div className="pt-3 border-t border-[#262626] flex items-center justify-between">
                          <div className="text-[11px]">
                            <span className="text-zinc-500 block">Venda: R$ {preco.toFixed(2)}</span>
                            <span className="text-emerald-400 font-semibold block">Margem: R$ {margem.toFixed(2)}</span>
                          </div>

                          <button
                            onClick={() => setModalFichaTecnica({ aberto: true, produto: p })}
                            className="bg-emerald-950/60 hover:bg-emerald-900 text-emerald-400 border border-emerald-800/60 font-bold px-3 py-1.5 rounded-lg text-xs flex items-center gap-1.5 transition-colors"
                          >
                            <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><rect width="8" height="4" x="8" y="2" rx="1" ry="1"/><path d="M9 12h6"/><path d="M9 16h6"/></svg>
                            Abrir Ficha
                          </button>
                        </div>
                      </div>
                    );
                  })}
                </div>
              </div>

            {/* 5. ABA FECHAMENTO MENSAL */}
            {abaAtiva === 'fechamento' && (!isSuperAdmin || impersonatedCompany) && (

                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#D95B1E" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect width="18" height="18" x="3" y="4" rx="2" ry="2"/><line x1="16" x2="16" y1="2" y2="6"/><line x1="8" x2="8" y1="2" y2="6"/><line x1="3" x2="21" y1="10" y2="10"/></svg>
                        Resumo do Ciclo Atual
                      </h2>
                      <span className="text-xs text-zinc-400">Lançamentos acumulados até ao momento</span>
                    </div>
                    <span className="text-xs font-mono font-bold text-[#D95B1E] bg-[#D95B1E]/10 border border-[#D95B1E]/30 px-3 py-1 rounded-lg">
                      {lancamentosAtivos.length} registos ativos
                    </span>
                  </div>

                  <div className="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6">
                    <div className="bg-[#1f1f1f] p-4 rounded-xl border border-[#2d2d2d]">
                      <span className="text-[10px] uppercase font-bold text-zinc-500 block mb-1">Faturação Bruta</span>
                      <span className="text-lg font-bold text-white">R$ {faturamento.toFixed(2)}</span>
                    </div>
                    <div className="bg-[#1f1f1f] p-4 rounded-xl border border-[#2d2d2d]">
                      <span className="text-[10px] uppercase font-bold text-zinc-500 block mb-1">Total Despesas</span>
                      <span className="text-lg font-bold text-red-400">R$ {totalDespesas.toFixed(2)}</span>
                    </div>
                    <div className="bg-[#1f1f1f] p-4 rounded-xl border border-[#2d2d2d]">
                      <span className="text-[10px] uppercase font-bold text-zinc-500 block mb-1">Lucro Apurado</span>
                      <span className="text-lg font-bold text-emerald-400">R$ {resultadoMes.toFixed(2)}</span>
                    </div>
                    <div className="bg-[#1f1f1f] p-4 rounded-xl border border-[#2d2d2d]">

                      <span className="text-sm font-bold text-zinc-200 mt-1 block">{totalPratos} Pratos | {totalBebidas} Bebidas</span>
                    </div>
                  </div>

                  {/* Consumo de Ingredientes */}
                  <div className="mb-6">
                    <h3 className="text-xs font-bold text-zinc-400 uppercase tracking-wider mb-3">Estimativa de Insumos e Ingredientes Gastos</h3>
                    <div className="bg-[#1c1c1c] border border-[#262626] rounded-xl p-4 max-h-48 overflow-y-auto">

                              <span className="font-mono text-emerald-400">
                                {dados.qtd} {dados.unidade} 
                                <span className="text-zinc-500 ml-1.5">(R$ {dados.custoTotal.toFixed(2)})</span>
                              </span>
                            </div>
                          ))}
                        </div>
                      )}
                    </div>
                  </div>

                  <div className="flex justify-end pt-2">
                    <button
                      onClick={handleExecutarFechamento}
                      disabled={processandoFechamento || lancamentosAtivos.length === 0}

                      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 12V7H5a2 2 0 0 1 0-4h14v4"/><path d="M3 5v14a2 2 0 0 0 2 2h16v-5"/><path d="M18 12a2 2 0 0 0 0 4h4v-4Z"/></svg>

                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                      {historicoFechamentos.map(fech => (
                        <div key={fech.id} className="bg-[#161616] border border-[#262626] rounded-xl p-5 hover:border-zinc-600 transition-colors">

                            <h3 className="font-bold text-white text-sm">Competência: {fech.mes_ano}</h3>
                            <span className="text-[11px] text-zinc-500">{new Date(fech.data_fechamento).toLocaleDateString()}</span>

                          <div className="space-y-1.5 text-xs">
                            <div className="flex justify-between"><span className="text-zinc-400">Faturação:</span><span className="text-white font-mono font-bold">R$ {Number(fech.relatorio.faturamento).toFixed(2)}</span></div>
                            <div className="flex justify-between"><span className="text-zinc-400">Despesas:</span><span className="text-red-400 font-mono">R$ {Number(fech.relatorio.despesas).toFixed(2)}</span></div>

                          </div>
                        </div>
                      ))}
                    </div>
                  )}
                </div>
              </div>
            )}

            {/* 6. CONFIGURAÇÕES & ADMINISTRAÇÃO B2B */}
            {abaAtiva === 'configuracoes' && (
              <div className="max-w-6xl">
                {subAbaConfig === 'exclusoes' && (!isSuperAdmin || impersonatedCompany) && (
                  <div>
                    <h1 className="text-2xl font-bold text-white mb-1">Lixeira de Exclusões</h1>

                          </thead>
                          <tbody className="divide-y divide-[#262626]">
                            {lancamentosExcluidos.map(l => (
                              <tr key={l.id} className="hover:bg-[#1c1c1c]">
                                <td className="py-3">{l.data}</td>
                                <td className="py-3 text-zinc-400 line-through">{l.descricao}</td>
                                <td className="py-3 text-right text-zinc-400 line-through">R$ {Number(l.valor_total).toFixed(2)}</td>
                                <td className="py-3 text-red-400 font-bold pl-4">{l.motivo_exclusao}</td>
                              </tr>
                            ))}
                          </tbody>
                        </table>
                      )}
                    </div>
                  </div>
                )}

                    <form onSubmit={handleCreateCompanyB2B} className="bg-[#161616] border border-[#262626] p-6 rounded-xl mb-8 space-y-4">

                      <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
                        <input type="text" placeholder="Nome do Cliente (Ex: Lanchonete X)" value={newCompanyName} onChange={e => setNewCompanyName(e.target.value)} className="bg-[#202020] border border-[#333] rounded-lg p-2.5 text-xs text-white outline-none" required />
                        <input type="text" placeholder="ID Interno (Ex: lanchonete-x)" value={newCompanySlug} onChange={e => setNewCompanySlug(e.target.value)} className="bg-[#202020] border border-[#333] rounded-lg p-2.5 text-xs text-white outline-none" />
                        <input type="text" placeholder="WhatsApp / Telefone" value={newCompanyPhone} onChange={e => setNewCompanyPhone(e.target.value)} className="bg-[#202020] border border-[#333] rounded-lg p-2.5 text-xs text-white outline-none" />
                      </div>
                      <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                        <input type="text" placeholder="Login do Cliente" value={newCompanyAdminUser} onChange={e => setNewCompanyAdminUser(e.target.value)} className="bg-[#202020] border border-[#333] rounded-lg p-2.5 text-xs text-white outline-none" required />
                        <input type="password" placeholder="Palavra-passe Inicial (min. 4 dígitos)" value={newCompanyAdminPass} onChange={e => setNewCompanyAdminPass(e.target.value)} className="bg-[#202020] border border-[#333] rounded-lg p-2.5 text-xs text-white outline-none" required />
                      </div>
                      <div className="text-right">
                        <button type="submit" className="bg-blue-600 hover:bg-blue-500 text-white font-bold px-4 py-2 rounded-lg text-xs">Ativar Cozinha</button>
                      </div>
                    </form>

                    <div className="bg-[#161616] border border-[#262626] rounded-xl p-5">
                      <h2 className="text-xs font-bold text-zinc-400 uppercase tracking-wider mb-4">Cozinhas Registadas ({companiesList.length})</h2>
                      <div className="space-y-2">
                        {companiesList.map(comp => (
                          <div key={comp.id} className="bg-[#202020] p-3.5 rounded-lg border border-[#2d2d2d] flex justify-between items-center">
                            <div>
                              <p className="text-sm font-bold text-white flex items-center gap-2">{comp.company_name} <span className={`text-[9px] px-2 py-0.5 rounded font-bold uppercase ${comp.status === 'ativo' ? 'bg-emerald-950 text-emerald-400' : 'bg-red-950 text-red-400'}`}>{comp.status}</span></p>
                              <p className="text-[11px] text-zinc-500 font-mono mt-0.5">ID: {comp.company_id}</p>
                            </div>
                            <div className="flex items-center gap-2">
                              <button onClick={() => { setImpersonatedCompany(comp); setAbaAtiva('painel'); }} className="bg-amber-500/10 text-amber-400 border border-amber-500/30 px-3 py-1.5 rounded-lg text-xs font-bold flex items-center gap-1.5">
                                Aceder ao Painel 
                                <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" x2="21" y1="14" y2="3"/></svg>
                              </button>
                              <button onClick={() => handleToggleCompanyStatus(comp.id, comp.status)} className="bg-zinc-800 text-zinc-300 px-3 py-1.5 rounded-lg text-xs font-medium">{comp.status === 'ativo' ? 'Suspender' : 'Reativar'}</button>
                            </div>
                          </div>
                        ))}
                      </div>
                    </div>
                  </div>
                )}

                {/* SUB-ABA: CONTA & SESSÃO COM FOTO DE PERFIL EXPANDIDA */}
                {subAbaConfig === 'conta' && (
                  <div className="bg-[#161616] border border-[#262626] p-8 rounded-2xl w-full">
                    <div className="flex flex-col lg:flex-row gap-10">
                      
                      {/* Coluna Esquerda: Foto de Perfil */}
                      <div className="flex flex-col items-center shrink-0">

                            {currentUser?.avatar_url ? (
                              <img src={currentUser.avatar_url} alt="Perfil" className="w-full h-full object-cover" />

                              <span className="text-5xl font-black text-[#D95B1E] uppercase">

                            onClick={() => avatarInputRef.current?.click()}
                            className="absolute inset-0 bg-black/60 rounded-full flex flex-col items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity text-white text-xs font-semibold cursor-pointer"
                            title="Alterar foto de perfil"
                          >
                            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="mb-1"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/></svg>

                            {currentUser?.avatar_url ? 'Alterar foto' : 'Adicionar foto'}
                          </button>
                          {currentUser?.avatar_url && (
                            <button onClick={handleRemoveAvatar} className="text-xs text-zinc-500 hover:text-red-400 font-medium transition-colors">
                              Remover
                            </button>
                          )}
                        </div>
                      </div>

                      {/* Coluna Direita: Informações Expandidas */}
                      <div className="flex-1 w-full border-t lg:border-t-0 lg:border-l border-[#262626] pt-6 lg:pt-0 lg:pl-10">
                        <h1 className="text-2xl font-bold text-white mb-2">Informações da Sessão</h1>
                        <p className="text-xs text-zinc-400 mb-8">Gestão das credenciais ativas e permissões operacionais do sistema.</p>

                        <div className="space-y-5">
                          <div className="grid grid-cols-1 md:grid-cols-2 gap-5">
                            <div className="bg-[#1f1f1f] border border-[#2d2d2d] rounded-xl p-4">
                              <span className="text-[10px] uppercase font-bold text-zinc-500 block mb-1">Utilizador Conectado</span>
                              <span className="font-bold text-white text-base">{currentUser?.username}</span>
                            </div>
                            
                            <div className="bg-[#1f1f1f] border border-[#2d2d2d] rounded-xl p-4">
                              <span className="text-[10px] uppercase font-bold text-zinc-500 block mb-1">Função Base</span>
                              <span className="font-bold text-[#D95B1E] uppercase text-base">{currentUser?.role}</span>
                            </div>
