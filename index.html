<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>FoodStrick | Gestão Master</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- MÓDULOS EXTERNOS DE SUPORTE -->
  <script type="text/babel" src="LiveCursor.js"></script>
  <script type="text/babel" src="SupportChat.js"></script>

  <style>
    body { 
      background-color: #0f0f0f; 
      color: #f5f5f5; 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
    .btn-orange { background-color: #D95B1E; color: white; }
    .btn-orange:hover { background-color: #c34e17; }
    
    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #333; border-radius: 10px; }
    ::-webkit-scrollbar-thumb:hover { background: #555; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;
    
    const SUPABASE_URL = 'https://ddngvelrtqmfgaeqsjem.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_EhLCuypZr6vHrSKDCrHxQg_n7BvKxBU';
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const LOGIN_BG_IMAGE = "https://images.unsplash.com/photo-1555396273-367ea4eb4db5?q=80&w=1920&auto=format&fit=crop";

    function App() {
      const [isAuthenticated, setIsAuthenticated] = useState(false);
      const [currentUser, setCurrentUser] = useState(null);

      // Controle do Menu Mobile (Gaveta)
      const [mobileMenuOpen, setMobileMenuOpen] = useState(false);

      // Modo Suporte
      const [impersonatedCompany, setImpersonatedCompany] = useState(null);
      const [adminInsideNotification, setAdminInsideNotification] = useState(null);
      const [, setForceUpdate] = useState(0);

      // Login
      const [username, setUsername] = useState('');
      const [password, setPassword] = useState('');
      const [showPassword, setShowPassword] = useState(false);
      const [authError, setAuthError] = useState('');

      // Navegação
      const [abaAtiva, setAbaAtiva] = useState('painel'); 
      const [subAbaConfig, setSubAbaConfig] = useState('conta'); 

      // Dados Operacionais
      const [produtos, setProdutos] = useState([]);
      const [lancamentos, setLancamentos] = useState([]);
      const [historicoFechamentos, setHistoricoFechamentos] = useState([]);
      const [carregando, setCarregando] = useState(false);
      const [processandoFechamento, setProcessandoFechamento] = useState(false);

      // Modais
      const [modalExclusao, setModalExclusao] = useState({ aberto: false, idLancamento: null });
      const [motivoExclusao, setMotivoExclusao] = useState('Pedido cancelado');
      const [modalExcluirProduto, setModalExcluirProduto] = useState({ aberto: false, idProduto: null, nome: '' });
      
      const [modalEditarProduto, setModalEditarProduto] = useState({
        aberto: false, id: null, nome: '', preco_venda: '', custo_unitario: '', observacao: ''
      });

      const [modalFichaTecnica, setModalFichaTecnica] = useState({
        aberto: false, produto: null
      });
      const [novoInsumo, setNovoInsumo] = useState({
        nome: '', quantidade: '', custo: ''
      });

      // Formulários
      const [novoLancamento, setNovoLancamento] = useState({
        data: new Date().toISOString().split('T')[0],
        tipo: 'Venda', produto_id: '', descricao: '', quantidade: 1, 
        pagamento: 'Pix', canal_categoria: 'Delivery', valor_despesa: '', fornecedor: ''
      });

      const [novoProduto, setNovoProduto] = useState({
        nome: '', preco_venda: '', custo_unitario: '', observacao: ''
      });

      // Gestão Master (B2B)
      const [companiesList, setCompaniesList] = useState([]);
      const [newCompanyName, setNewCompanyName] = useState('');
      const [newCompanySlug, setNewCompanySlug] = useState('');
      const [newCompanyPhone, setNewCompanyPhone] = useState('');
      const [newCompanyAdminUser, setNewCompanyAdminUser] = useState('');
      const [newCompanyAdminPass, setNewCompanyAdminPass] = useState('');

      const avatarInputRef = useRef(null);

      const isSuperAdmin = currentUser?.role === 'superadmin' || currentUser?.username === 'admin';
      const effectiveCompanyId = impersonatedCompany ? impersonatedCompany.company_id : currentUser?.company_id;
      const effectiveCompanyName = impersonatedCompany ? impersonatedCompany.company_name : (currentUser?.unidade || 'FoodStrick');

      useEffect(() => {
        const trigger = () => setForceUpdate(n => n + 1);
        window.addEventListener('live-cursor-loaded', trigger);
        window.addEventListener('support-chat-loaded', trigger);
        const t1 = setTimeout(trigger, 300);
        const t2 = setTimeout(trigger, 1000);
        return () => {
          window.removeEventListener('live-cursor-loaded', trigger);
          window.removeEventListener('support-chat-loaded', trigger);
          clearTimeout(t1);
          clearTimeout(t2);
        };
      }, []);

      useEffect(() => {
        const saved = localStorage.getItem('foodstrick_master_session');
        if (saved) {
          try {
            const parsed = JSON.parse(saved);
            setCurrentUser(parsed);
            setIsAuthenticated(true);
            if (parsed.role === 'superadmin') {
              setAbaAtiva('configuracoes');
              setSubAbaConfig('empresas');
              fetchCompanies();
            }
          } catch (e) {}
        }
      }, []);

      useEffect(() => {
        if (!isAuthenticated || !currentUser || isSuperAdmin) return;

        const verificarSuporteAtivo = async () => {
          try {
            const { data } = await supabaseClient
              .from('app_users')
              .select('active_support_by')
              .eq('company_id', currentUser.company_id)
              .maybeSingle();

            if (data && data.active_support_by) {
              setAdminInsideNotification(data.active_support_by);
            } else {
              setAdminInsideNotification(null);
            }
          } catch (err) {}
        };

        verificarSuporteAtivo();
        const interval = setInterval(verificarSuporteAtivo, 4000);
        return () => clearInterval(interval);
      }, [isAuthenticated, currentUser, isSuperAdmin]);

      useEffect(() => {
        if (isAuthenticated && effectiveCompanyId && effectiveCompanyId !== 'foodstrick-master') {
          carregarDadosOperacionais(effectiveCompanyId);
          carregarHistoricoFechamentos(effectiveCompanyId);
        }
      }, [isAuthenticated, effectiveCompanyId]);

      async function carregarDadosOperacionais(compId) {
        setCarregando(true);
        try {
          let prodsData = [];
          let lancsData = [];

          const resProd = await supabaseClient
            .from('produtos')
            .select('*')
            .or(`company_id.eq.${compId},company_id.eq.cozinha-brasileira,company_id.is.null`)
            .order('nome');

          const resLanc = await supabaseClient
            .from('lancamentos')
            .select('*')
            .or(`company_id.eq.${compId},company_id.eq.cozinha-brasileira,company_id.is.null`)
            .order('data', { ascending: false });

          if (!resProd.error && resProd.data) prodsData = resProd.data;
          else {
            const fallbackProd = await supabaseClient.from('produtos').select('*').order('nome');
            if (fallbackProd.data) prodsData = fallbackProd.data;
          }

          if (!resLanc.error && resLanc.data) lancsData = resLanc.data;
          else {
            const fallbackLanc = await supabaseClient.from('lancamentos').select('*').order('data', { ascending: false });
            if (fallbackLanc.data) lancsData = fallbackLanc.data;
          }

          setProdutos(prodsData);
          setLancamentos(lancsData);
        } catch (err) {}
        setCarregando(false);
      }

      async function carregarHistoricoFechamentos(compId) {
        try {
          const { data } = await supabaseClient
            .from('fechamentos')
            .select('*')
            .eq('company_id', compId)
            .order('data_fechamento', { ascending: false });
          if (data) setHistoricoFechamentos(data);
        } catch (err) {}
      }

      const handleLogin = async (e) => {
        e.preventDefault();
        setAuthError('');
        const cleanUser = username.trim().toLowerCase();

        if (cleanUser === 'admin' && (password === 'admin123' || password === '123')) {
          const superAdminObj = { username: 'admin', role: 'superadmin', company_id: 'foodstrick-master', unidade: 'FoodStrick Master' };
          localStorage.setItem('foodstrick_master_session', JSON.stringify(superAdminObj));
          setCurrentUser(superAdminObj);
          setIsAuthenticated(true);
          setAbaAtiva('configuracoes');
          setSubAbaConfig('empresas');
          fetchCompanies();
          return;
        }

        if (cleanUser === 'cozinha' && password === '123') {
          let avatar = null;
          try {
            const { data } = await supabaseClient.from('app_users').select('avatar_url').eq('username', 'cozinha').maybeSingle();
            if (data) avatar = data.avatar_url;
          } catch(e){}

          const legacyObj = { username: 'cozinha', role: 'operador', company_id: 'cozinha-brasileira', unidade: 'Cozinha Brasileira', avatar_url: avatar };
          localStorage.setItem('foodstrick_master_session', JSON.stringify(legacyObj));
          setCurrentUser(legacyObj);
          setIsAuthenticated(true);
          setAbaAtiva('painel');
          return;
        }

        try {
          const { data: userData } = await supabaseClient
            .from('app_users')
            .select('*')
            .ilike('username', cleanUser)
            .eq('password', password)
            .maybeSingle();

          if (userData) {
            const { data: comp } = await supabaseClient.from('companies').select('*').eq('company_id', userData.company_id).maybeSingle();
            if (comp && comp.status === 'bloqueado') {
              setAuthError('Acesso bloqueado: este estabelecimento está suspenso.');
              return;
            }

            const userObj = { 
              username: userData.username, 
              role: userData.role || 'operador', 
              company_id: userData.company_id,
              unidade: comp ? comp.company_name : 'Minha Cozinha',
              avatar_url: userData.avatar_url
            };
            localStorage.setItem('foodstrick_master_session', JSON.stringify(userObj));
            setCurrentUser(userObj);
            setIsAuthenticated(true);
            setAbaAtiva('painel');
            return;
          }
        } catch (err) {}

        setAuthError('Usuário ou senha incorretos.');
      };

      const handleLogout = async () => {
        if (impersonatedCompany) {
          await handleStopImpersonation();
        }
        localStorage.removeItem('foodstrick_master_session');
        setIsAuthenticated(false);
        setCurrentUser(null);
        setImpersonatedCompany(null);
        setAdminInsideNotification(null);
        setUsername(''); setPassword('');
        setProdutos([]); setLancamentos([]);
        setMobileMenuOpen(false);
      };

      const handleStartImpersonation = async (comp) => {
        try {
          await supabaseClient
            .from('app_users')
            .update({ active_support_by: currentUser.username })
            .eq('company_id', comp.company_id);

          setImpersonatedCompany(comp);
          setAbaAtiva('painel');
          setMobileMenuOpen(false);
        } catch (err) {}
      };

      const handleStopImpersonation = async () => {
        if (impersonatedCompany) {
          try {
            await supabaseClient
              .from('app_users')
              .update({ active_support_by: null })
              .eq('company_id', impersonatedCompany.company_id);
          } catch (err) {}
        }
        setImpersonatedCompany(null);
        setAbaAtiva('configuracoes');
        setSubAbaConfig('empresas');
      };

      // Cálculos Financeiros
      const lancamentosAtivos = lancamentos.filter(l => l.status === 'ativo' || l.status === null);
      const lancamentosExcluidos = lancamentos.filter(l => l.status === 'excluido');

      const faturamento = lancamentosAtivos.filter(l => l.tipo === 'Venda').reduce((acc, curr) => acc + Number(curr.valor_total), 0);
      const lucroProdutos = lancamentosAtivos.filter(l => l.tipo === 'Venda').reduce((acc, curr) => acc + (Number(curr.valor_total) - Number(curr.custo_total)), 0);
      const totalDespesas = lancamentosAtivos.filter(l => l.tipo === 'Despesa').reduce((acc, curr) => acc + Number(curr.valor_total), 0);
      const resultadoMes = lucroProdutos - totalDespesas;

      const totalBebidas = lancamentosAtivos.filter(l => l.tipo === 'Venda' && l.canal_categoria === 'Bebidas').reduce((acc, curr) => acc + Number(curr.quantidade || 0), 0);
      const totalPratos = lancamentosAtivos.filter(l => l.tipo === 'Venda' && l.canal_categoria !== 'Bebidas').reduce((acc, curr) => acc + Number(curr.quantidade || 0), 0);

      let ingredientesUsados = {};
      lancamentosAtivos.filter(l => l.tipo === 'Venda').forEach(venda => {
        const prod = produtos.find(p => p.id === venda.produto_id);
        if (prod && Array.isArray(prod.ingredientes)) {
          prod.ingredientes.forEach(ing => {
            const num = parseFloat(ing.quantidade) || 1;
            const totalQtd = num * Number(venda.quantidade || 1);
            const unidade = String(ing.quantidade).replace(/[0-9.,]/g, '').trim() || 'un';
            
            if (!ingredientesUsados[ing.nome]) {
              ingredientesUsados[ing.nome] = { qtd: 0, unidade: unidade, custoTotal: 0 };
            }
            ingredientesUsados[ing.nome].qtd += totalQtd;
            ingredientesUsados[ing.nome].custoTotal += (Number(ing.custo || 0) * Number(venda.quantidade || 1));
          });
        }
      });
      const arrayIngredientes = Object.entries(ingredientesUsados).sort((a, b) => b[1].qtd - a[1].qtd);

      async function handleSalvarLancamento(e) {
        e.preventDefault();
        const compTarget = effectiveCompanyId || 'cozinha-brasileira';
        let total = 0, custo = 0, desc = novoLancamento.descricao;

        if (novoLancamento.tipo === 'Venda') {
          const prod = produtos.find(p => p.id === novoLancamento.produto_id);
          if (!prod) return alert('Selecione um produto.');
          desc = prod.nome;
          total = Number(prod.preco_venda) * Number(novoLancamento.quantidade);
          custo = Number(prod.custo_unitario) * Number(novoLancamento.quantidade);
        } else {
          total = Number(novoLancamento.valor_despesa);
        }

        const payload = {
          company_id: compTarget,
          data: novoLancamento.data, 
          tipo: novoLancamento.tipo,
          descricao: desc, 
          produto_id: novoLancamento.tipo === 'Venda' ? novoLancamento.produto_id : null,
          quantidade: novoLancamento.tipo === 'Venda' ? Number(novoLancamento.quantidade) : null,
          pagamento: novoLancamento.pagamento, 
          canal_categoria: novoLancamento.canal_categoria,
          valor_total: total, 
          custo_total: custo, 
          resultado: novoLancamento.tipo === 'Venda' ? total - custo : -total,
          fornecedor: novoLancamento.tipo === 'Despesa' ? novoLancamento.fornecedor : null, 
          status: 'ativo'
        };

        const { error } = await supabaseClient.from('lancamentos').insert([payload]);
        if (error) alert("Erro: " + error.message);
        else {
          carregarDadosOperacionais(compTarget);
          setNovoLancamento({ ...novoLancamento, descricao: '', valor_despesa: '', quantidade: 1, produto_id: '', fornecedor: '' });
        }
      }

      async function confirmarExclusao() {
        if (!modalExclusao.idLancamento) return;
        const compTarget = effectiveCompanyId || 'cozinha-brasileira';
        const { error } = await supabaseClient.from('lancamentos').update({ status: 'excluido', motivo_exclusao: motivoExclusao }).eq('id', modalExclusao.idLancamento);
        if (error) alert("Erro: " + error.message);
        else { carregarDadosOperacionais(compTarget); setModalExclusao({ aberto: false, idLancamento: null }); }
      }

      async function handleSalvarProduto(e) {
        e.preventDefault();
        const compTarget = effectiveCompanyId || 'cozinha-brasileira';
        const payload = {
          company_id: compTarget, 
          nome: novoProduto.nome,
          preco_venda: parseFloat(novoProduto.preco_venda), 
          custo_unitario: parseFloat(novoProduto.custo_unitario), 
          observacao: novoProduto.observacao,
          ingredientes: []
        };
        const { error } = await supabaseClient.from('produtos').insert([payload]);
        if (error) alert("Erro: " + error.message);
        else { carregarDadosOperacionais(compTarget); setNovoProduto({ nome: '', preco_venda: '', custo_unitario: '', observacao: '' }); }
      }

      async function handleAtualizarProduto(e) {
        e.preventDefault();
        const compTarget = effectiveCompanyId || 'cozinha-brasileira';
        const payload = {
          nome: modalEditarProduto.nome,
          preco_venda: parseFloat(modalEditarProduto.preco_venda),
          custo_unitario: parseFloat(modalEditarProduto.custo_unitario),
          observacao: modalEditarProduto.observacao
        };

        const { error } = await supabaseClient.from('produtos').update(payload).eq('id', modalEditarProduto.id);
        if (error) alert("Erro ao atualizar produto: " + error.message);
        else {
          carregarDadosOperacionais(compTarget);
          setModalEditarProduto({ aberto: false, id: null, nome: '', preco_venda: '', custo_unitario: '', observacao: '' });
        }
      }

      async function deletarProduto(id) {
        const compTarget = effectiveCompanyId || 'cozinha-brasileira';
        const temLancamentos = lancamentos.some(l => l.produto_id === id);
        if (temLancamentos) {
          alert("Atenção: Este produto já possui vendas registradas e não pode ser apagado.");
          setModalExcluirProduto({ aberto: false, idProduto: null, nome: '' });
          return;
        }
        const { error } = await supabaseClient.from('produtos').delete().eq('id', id);
        if (error) alert("Erro: " + error.message);
        else { carregarDadosOperacionais(compTarget); setModalExcluirProduto({ aberto: false, idProduto: null, nome: '' }); }
      }

      async function handleAdicionarInsumo(e) {
        e.preventDefault();
        if (!modalFichaTecnica.produto) return;
        const prod = modalFichaTecnica.produto;
        const listaAtual = Array.isArray(prod.ingredientes) ? prod.ingredientes : [];
        
        const item = {
          id: Date.now().toString(),
          nome: novoInsumo.nome.trim(),
          quantidade: novoInsumo.quantidade.trim(),
          custo: parseFloat(novoInsumo.custo) || 0
        };

        const novaLista = [...listaAtual, item];
        const novoCustoTotal = novaLista.reduce((acc, curr) => acc + Number(curr.custo || 0), 0);

        const { error } = await supabaseClient.from('produtos').update({ ingredientes: novaLista, custo_unitario: novoCustoTotal }).eq('id', prod.id);

        if (error) {
          alert("Erro ao adicionar ingrediente: " + error.message);
        } else {
          const prodAtualizado = { ...prod, ingredientes: novaLista, custo_unitario: novoCustoTotal };
          setModalFichaTecnica({ aberto: true, produto: prodAtualizado });
          setNovoInsumo({ nome: '', quantidade: '', custo: '' });
          carregarDadosOperacionais(effectiveCompanyId);
        }
      }

      async function handleRemoverInsumo(insumoId) {
        if (!modalFichaTecnica.produto) return;
        const prod = modalFichaTecnica.produto;
        const listaAtual = Array.isArray(prod.ingredientes) ? prod.ingredientes : [];
        const novaLista = listaAtual.filter(i => i.id !== insumoId);
        const novoCustoTotal = novaLista.reduce((acc, curr) => acc + Number(curr.custo || 0), 0);

        const { error } = await supabaseClient.from('produtos').update({ ingredientes: novaLista, custo_unitario: novaLista.length > 0 ? novoCustoTotal : prod.custo_unitario }).eq('id', prod.id);

        if (error) {
          alert("Erro ao remover ingrediente: " + error.message);
        } else {
          const prodAtualizado = { ...prod, ingredientes: novaLista, custo_unitario: novaLista.length > 0 ? novoCustoTotal : prod.custo_unitario };
          setModalFichaTecnica({ aberto: true, produto: prodAtualizado });
          carregarDadosOperacionais(effectiveCompanyId);
        }
      }

      async function handleExecutarFechamento() {
        if (lancamentosAtivos.length === 0) return alert("Não existem lançamentos ativos para fechar.");
        const dataAtual = new Date();
        const mesAno = `${dataAtual.getMonth() + 1}/${dataAtual.getFullYear()}`;
        if (!window.confirm(`Confirma o encerramento do mês ${mesAno}?\nO painel e os lançamentos serão zerados para o próximo ciclo.`)) return;

        setProcessandoFechamento(true);
        const compTarget = effectiveCompanyId || 'cozinha-brasileira';

        await supabaseClient.from('fechamentos').insert([{
          company_id: compTarget,
          mes_ano: mesAno,
          relatorio: { faturamento, despesas: totalDespesas, lucro: resultadoMes, totalPratos, totalBebidas, ingredientes: arrayIngredientes, totalRegistros: lancamentosAtivos.length }
        }]);

        const ids = lancamentosAtivos.map(l => l.id);
        await supabaseClient.from('lancamentos').update({ status: 'arquivado' }).in('id', ids);

        alert("Fechamento concluído com sucesso!");
        carregarDadosOperacionais(compTarget);
        carregarHistoricoFechamentos(compTarget);
        setProcessandoFechamento(false);
      }

      const fetchCompanies = async () => {
        const { data } = await supabaseClient.from('companies').select('*').order('created_at', { ascending: false });
        if (data) setCompaniesList(data);
      };

      const handleCreateCompanyB2B = async (e) => {
        e.preventDefault();
        const cleanName = newCompanyName.trim();
        let cleanSlug = newCompanySlug.trim().toLowerCase().replace(/[^a-z0-9-]/g, '-');
        if (!cleanSlug) cleanSlug = cleanName.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-z0-9]+/g, '-');

        await supabaseClient.from('companies').insert([{ company_id: cleanSlug, company_name: cleanName, contact_phone: newCompanyPhone.trim(), status: 'ativo' }]);
        await supabaseClient.from('app_users').insert([{ username: newCompanyAdminUser.trim().toLowerCase(), password: newCompanyAdminPass.trim(), role: 'admin', company_id: cleanSlug }]);

        alert(`Restaurante "${cleanName}" registrado com sucesso!`);
        setNewCompanyName(''); setNewCompanySlug(''); setNewCompanyPhone(''); setNewCompanyAdminUser(''); setNewCompanyAdminPass('');
        fetchCompanies();
      };

      const handleToggleCompanyStatus = async (id, currentStatus) => {
        await supabaseClient.from('companies').update({ status: currentStatus === 'ativo' ? 'bloqueado' : 'ativo' }).eq('id', id);
        fetchCompanies();
      };

      const handleAvatarUpload = (e) => {
        const file = e.target.files[0];
        if (!file || !currentUser) return;
        const reader = new FileReader();
        reader.onload = (event) => {
          const img = new Image();
          img.onload = async () => {
            const canvas = document.createElement('canvas');
            const maxSize = 250;
            let width = img.width, height = img.height;
            if (width > height) { if (width > maxSize) { height = Math.round((height * maxSize) / width); width = maxSize; } }
            else { if (height > maxSize) { width = Math.round((width * maxSize) / height); height = maxSize; } }
            canvas.width = width; canvas.height = height;
            canvas.getContext('2d').drawImage(img, 0, 0, width, height);
            const compressedBase64 = canvas.toDataURL('image/jpeg', 0.85);
            
            const updatedUser = { ...currentUser, avatar_url: compressedBase64 };

            localStorage.setItem('foodstrick_master_session', JSON.stringify(updatedUser));
            await supabaseClient.from('app_users').update({ avatar_url: compressedBase64 }).eq('username', currentUser.username);
          };
          img.src = event.target.result;
        };
        reader.readAsDataURL(file);
      };

                          <input type="text" value={novoLancamento.fornecedor} onChange={e => setNovoLancamento({...novoLancamento, fornecedor: e.target.value})} className="w-full bg-[#202020] border border-[#333] rounded-lg p-2.5 text-base md:text-xs text-white outline-none" />
                        </div>
                      </>
                    )}
                  </div>
                  <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-3">
                    {novoLancamento.tipo === 'Venda' ? (
                      <div>
                        <label className="block text-[11px] font-medium text-zinc-400 mb-1">Quantidade</label>
                        <input type="number" min="1" value={novoLancamento.quantidade} onChange={e => setNovoLancamento({...novoLancamento, quantidade: e.target.value})} className="w-full bg-[#202020] border border-[#333] rounded-lg p-2.5 text-base md:text-xs text-white outline-none" required />
                      </div>
                    ) : (
                      <div>
                        <label className="block text-[11px] font-medium text-zinc-400 mb-1">Valor (R$)</label>
                        <input type="number" step="0.01" value={novoLancamento.valor_despesa} onChange={e => setNovoLancamento({...novoLancamento, valor_despesa: e.target.value})} className="w-full bg-[#202020] border border-[#333] rounded-lg p-2.5 text-base md:text-xs text-white outline-none" required />
                      </div>
                    )}
                    <div>
                      <label className="block text-[11px] font-medium text-zinc-400 mb-1">Pagamento</label>
                      <select value={novoLancamento.pagamento} onChange={e => setNovoLancamento({...novoLancamento, pagamento: e.target.value})} className="w-full bg-[#202020] border border-[#333] rounded-lg p-2.5 text-base md:text-xs text-white outline-none">
                        <option>Pix</option><option>Cartão</option><option>Dinheiro</option><option>Transferência</option><option>Outro</option>
                      </select>
                    </div>
                    <div>
                      <label className="block text-[11px] font-medium text-zinc-400 mb-1">Canal / Categoria</label>
                      <select value={novoLancamento.canal_categoria} onChange={e => setNovoLancamento({...novoLancamento, canal_categoria: e.target.value})} className="w-full bg-[#202020] border border-[#333] rounded-lg p-2.5 text-base md:text-xs text-white outline-none">
                        <option>Delivery</option><option>Retirada</option><option>Evento</option><option>Insumos</option><option>Embalagens</option><option>Bebidas</option><option>Outros</option>
                      </select>
                    </div>
                    <div className="flex items-end">
                      <button type="submit" className="w-full btn-orange font-bold py-3 md:py-2.5 rounded-lg text-xs shadow-md">Registar Operação</button>
                    </div>
                  </div>
                </form>

                <div className="bg-[#161616] border border-[#262626] rounded-xl p-4 sm:p-5 overflow-hidden shadow-sm">

                  <div className="overflow-x-auto">
                    <table className="w-full text-left text-xs text-zinc-400 min-w-[580px]">
                      <thead className="border-b border-[#262626]">

                          <th className="pb-2.5 uppercase">Data</th>
                          <th className="pb-2.5 uppercase">Tipo</th>
                          <th className="pb-2.5 uppercase">Descrição</th>
                          <th className="pb-2.5 uppercase text-center">Qtd</th>
                          <th className="pb-2.5 uppercase">Canal</th>
                          <th className="pb-2.5 uppercase text-right">Valor</th>
                          <th className="pb-2.5 uppercase text-center"></th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-[#262626]">
                        {lancamentosAtivos.map(l => (
                          <tr key={l.id} className="hover:bg-[#1c1c1c] group">
                            <td className="py-2.5">{l.data}</td>
                            <td className="py-2.5"><span className={`px-2 py-0.5 rounded text-[10px] font-bold uppercase ${l.tipo === 'Venda' ? 'bg-emerald-950/60 text-emerald-400' : 'bg-red-950/60 text-red-400'}`}>{l.tipo}</span></td>
                            <td className="py-2.5 text-white font-medium">{l.descricao}{l.fornecedor && <span className="text-[10px] text-zinc-500 block">Forn: {l.fornecedor}</span>}</td>
                            <td className="py-2.5 text-center text-white">{l.quantidade || '-'}</td>
                            <td className="py-2.5">{l.canal_categoria}</td>
                            <td className="py-2.5 text-right font-bold text-white">R$ {Number(l.valor_total).toFixed(2)}</td>
                            <td className="py-2.5 text-center">
                              <button onClick={() => setModalExclusao({ aberto: true, idLancamento: l.id })} className="p-1.5 text-zinc-500 hover:text-red-400 rounded">
                                <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></svg>
                              </button>
                            </td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                </div>
              </div>
            )}

            {/* 3. ABA PRODUTOS & CARDÁPIO */}
            {abaAtiva === 'produtos' && (!isSuperAdmin || impersonatedCompany) && (
              <div className="max-w-6xl">
                <header className="mb-5"><h1 className="text-xl sm:text-2xl font-bold text-white">Produtos & Cardápio</h1></header>
                <form onSubmit={handleSalvarProduto} className="bg-[#161616] border border-[#262626] p-4 sm:p-6 rounded-xl mb-6 space-y-3">
                  <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-3">
                    <div>
                      <label className="block text-[11px] font-medium text-zinc-400 mb-1">Nome do Item</label>
                      <input type="text" value={novoProduto.nome} onChange={e => setNovoProduto({...novoProduto, nome: e.target.value})} className="w-full bg-[#202020] border border-[#333] rounded-lg p-2.5 text-base md:text-xs text-white outline-none" required />
                    </div>
                    <div>
                      <label className="block text-[11px] font-medium text-zinc-400 mb-1">Preço Venda (R$)</label>
                      <input type="number" step="0.01" value={novoProduto.preco_venda} onChange={e => setNovoProduto({...novoProduto, preco_venda: e.target.value})} className="w-full bg-[#202020] border border-[#333] rounded-lg p-2.5 text-base md:text-xs text-white outline-none" required />
                    </div>
                    <div>
                      <label className="block text-[11px] font-medium text-zinc-400 mb-1">Custo Insumo (R$)</label>
                      <input type="number" step="0.01" value={novoProduto.custo_unitario} onChange={e => setNovoProduto({...novoProduto, custo_unitario: e.target.value})} className="w-full bg-[#202020] border border-[#333] rounded-lg p-2.5 text-base md:text-xs text-white outline-none" required />
                    </div>
                    <div className="flex items-end">
                      <button type="submit" className="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3 md:py-2.5 rounded-lg text-xs shadow-md">Guardar Produto</button>
                    </div>
                  </div>
                </form>

                  <h2 className="text-xs sm:text-sm font-bold text-white mb-3">Itens Registados ({produtos.length})</h2>
                  <div className="overflow-x-auto">
                    <table className="w-full text-left text-xs text-zinc-400 min-w-[580px]">
                      <thead className="border-b border-[#262626]">
                        <tr>
                          <th className="pb-2.5 uppercase">Item</th>
                          <th className="pb-2.5 uppercase">Preço Venda</th>
                          <th className="pb-2.5 uppercase">Custo</th>
                          <th className="pb-2.5 uppercase">Margem Bruta</th>
                          <th className="pb-2.5 uppercase">Margem (%)</th>
                          <th className="pb-2.5 uppercase text-right pr-2">Ações</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-[#262626]">
                        {produtos.map(p => {
                          const margem = Number(p.preco_venda) - Number(p.custo_unitario);
                          const pct = p.preco_venda > 0 ? ((margem / p.preco_venda) * 100).toFixed(1) : 0;
                          const totalIng = Array.isArray(p.ingredientes) ? p.ingredientes.length : 0;
                          return (
                            <tr key={p.id} className="hover:bg-[#1c1c1c]">
                              <td className="py-2.5 text-white font-medium">
                                {p.nome}
                                {totalIng > 0 && (
                                  <span className="ml-1.5 px-1.5 py-0.5 rounded text-[9px] font-semibold bg-emerald-950/80 text-emerald-400 border border-emerald-900/60">
                                    {totalIng}
                                  </span>
                                )}
                              </td>
                              <td className="py-2.5 text-white">R$ {Number(p.preco_venda).toFixed(2)}</td>
                              <td className="py-2.5">R$ {Number(p.custo_unitario).toFixed(2)}</td>
                              <td className="py-2.5 font-bold text-emerald-400">R$ {margem.toFixed(2)}</td>
                              <td className="py-2.5 text-zinc-300">{pct}%</td>
                              <td className="py-2.5 text-right pr-2">
                                <div className="flex items-center justify-end gap-1">
                                  <button onClick={() => setModalFichaTecnica({ aberto: true, produto: p })} className="p-1.5 text-zinc-400 hover:text-emerald-400 rounded" title="Ficha Técnica">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><rect width="8" height="4" x="8" y="2" rx="1" ry="1"/><path d="M9 12h6"/><path d="M9 16h6"/></svg>
                                  </button>
                                  <button onClick={() => setModalEditarProduto({ aberto: true, id: p.id, nome: p.nome, preco_venda: p.preco_venda, custo_unitario: p.custo_unitario, observacao: p.observacao || '' })} className="p-1.5 text-zinc-400 hover:text-amber-400 rounded" title="Editar Preço">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/><path d="m15 5 4 4"/></svg>
                                  </button>
                                  <button onClick={() => setModalExcluirProduto({ aberto: true, idProduto: p.id, nome: p.nome })} className="p-1.5 text-zinc-400 hover:text-red-400 rounded" title="Eliminar">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></svg>
                                  </button>
                                </div>
                              </td>
                            </tr>
                          );
                        })}
                      </tbody>
                    </table>
                  </div>
                </div>
              </div>
            )}

            {/* 4. ABA FICHAS TÉCNICAS */}
            {abaAtiva === 'fichas' && (!isSuperAdmin || impersonatedCompany) && (
              <div className="max-w-6xl">

                  <h1 className="text-xl sm:text-2xl font-bold text-white">Central de Fichas Técnicas</h1>

                </header>

                <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3">

                    const ingList = Array.isArray(p.ingredientes) ? p.ingredientes : [];
                    const somaCusto = ingList.reduce((acc, curr) => acc + Number(curr.custo || 0), 0);
                    const custoFinal = ingList.length > 0 ? somaCusto : Number(p.custo_unitario || 0);
                    const preco = Number(p.preco_venda || 0);
                    const margem = preco - custoFinal;

                    return (
                      <div key={p.id} className="bg-[#161616] border border-[#262626] rounded-xl p-4 flex flex-col justify-between">
                        <div>
                          <div className="flex items-start justify-between mb-2.5">
                            <div>
                              <h3 className="text-sm sm:text-base font-bold text-white">{p.nome}</h3>
                              <span className="text-[10px] text-zinc-500">{ingList.length} insumos</span>
                            </div>
                            <span className="text-xs font-mono font-bold text-emerald-400 bg-emerald-950/60 px-2 py-0.5 rounded border border-emerald-900/60">
                              R$ {custoFinal.toFixed(2)}
                            </span>
                          </div>

                          <div className="bg-[#1f1f1f] rounded-lg p-2.5 my-2 space-y-1 text-xs text-zinc-300">
                            {ingList.length === 0 ? (
                              <p className="text-zinc-500 italic text-[11px]">Nenhum ingrediente adicionado.</p>

                              ingList.slice(0, 3).map((item, idx) => (
                                <div key={idx} className="flex justify-between text-[11px]">
                                  <span className="text-zinc-400 truncate max-w-[130px]">{item.nome} ({item.quantidade})</span>
                                  <span className="text-white font-mono">R$ {Number(item.custo).toFixed(2)}</span>
                                </div>
                              ))
                            )}
                          </div>
                        </div>

                        <div className="pt-2.5 border-t border-[#262626] flex items-center justify-between">
                          <span className="text-emerald-400 text-xs font-semibold">Margem: R$ {margem.toFixed(2)}</span>
                          <button onClick={() => setModalFichaTecnica({ aberto: true, produto: p })} className="bg-emerald-950/60 hover:bg-emerald-900 text-emerald-400 border border-emerald-800/60 font-bold px-3 py-1.5 rounded-lg text-xs">
                            Abrir Ficha
                          </button>
                        </div>
                      </div>
                    );
                  })}
                </div>
              </div>
            )}

            {/* 5. ABA FECHAMENTO MENSAL */}
            {abaAtiva === 'fechamento' && (!isSuperAdmin || impersonatedCompany) && (
              <div className="max-w-6xl">

                  <h1 className="text-xl sm:text-2xl font-bold text-white">Fechamento do Mês</h1>

                </header>

                <div className="bg-[#161616] border border-[#D95B1E]/40 rounded-2xl p-4 sm:p-6 mb-6 shadow-xl">

                    <h2 className="text-sm sm:text-base font-bold text-white flex items-center gap-2">
                      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#D95B1E" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect width="18" height="18" x="3" y="4" rx="2" ry="2"/><line x1="16" x2="16" y1="2" y2="6"/><line x1="8" x2="8" y1="2" y2="6"/><line x1="3" x2="21" y1="10" y2="10"/></svg>
                      Resumo Atual
                    </h2>
                    <span className="text-[10px] sm:text-xs font-mono font-bold text-[#D95B1E] bg-[#D95B1E]/10 border border-[#D95B1E]/30 px-2 py-0.5 rounded">

                    <div className="bg-[#1f1f1f] p-3 rounded-xl border border-[#2d2d2d]"><span className="text-[9px] text-zinc-500 uppercase block">Despesas</span><span className="text-sm sm:text-lg font-bold text-red-400">R$ {totalDespesas.toFixed(2)}</span></div>

                    <div className="bg-[#1f1f1f] p-3 rounded-xl border border-[#2d2d2d]"><span className="text-[9px] text-zinc-500 uppercase block">Volume</span><span className="text-xs sm:text-sm font-bold text-zinc-200 mt-0.5 block">{totalPratos}P / {totalBebidas}B</span></div>
                  </div>

                  <button onClick={handleExecutarFechamento} disabled={processandoFechamento || lancamentosAtivos.length === 0} className="w-full bg-[#D95B1E] hover:bg-[#c34e17] disabled:opacity-50 text-white font-bold py-3.5 sm:py-3 rounded-xl text-xs transition-all shadow-lg active:scale-95">
                    {processandoFechamento ? 'A processar...' : 'Encerrar Mês & Arquivar Lançamentos'}

                </div>

                <div>
                  <h2 className="text-sm sm:text-base font-bold text-white mb-3">Extratos Anteriores</h2>

                    <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                      {historicoFechamentos.map(fech => (
                        <div key={fech.id} className="bg-[#161616] border border-[#262626] rounded-xl p-4">
                          <div className="flex justify-between items-center pb-2 border-b border-[#262626] mb-2">
                            <h3 className="font-bold text-white text-xs">Mês: {fech.mes_ano}</h3>
                            <span className="text-[10px] text-zinc-500">{new Date(fech.data_fechamento).toLocaleDateString()}</span>
                          </div>
                          <div className="space-y-1 text-xs">
                            <div className="flex justify-between"><span className="text-zinc-400">Faturação:</span><span className="text-white font-mono">R$ {Number(fech.relatorio.faturamento).toFixed(2)}</span></div>
                            <div className="flex justify-between"><span className="text-zinc-400">Despesas:</span><span className="text-red-400 font-mono">R$ {Number(fech.relatorio.despesas).toFixed(2)}</span></div>

              <div className="max-w-6xl">
                
                {/* ABAS DE NAVEGAÇÃO SUPERIOR NO MOBILE */}
                <div className="md:hidden flex items-center gap-1.5 overflow-x-auto pb-3 mb-4 border-b border-[#242424]">
                  {(!isSuperAdmin || impersonatedCompany) && (
                    <button onClick={() => setSubAbaConfig('exclusoes')} className={`px-3 py-1.5 rounded-lg text-xs font-semibold whitespace-nowrap ${subAbaConfig === 'exclusoes' ? 'bg-[#D95B1E] text-white' : 'bg-[#1c1c1c] text-zinc-400'}`}>
                      Lixeira
                    </button>
                  )}
                  <button onClick={() => setSubAbaConfig('conta')} className={`px-3 py-1.5 rounded-lg text-xs font-semibold whitespace-nowrap ${subAbaConfig === 'conta' ? 'bg-[#D95B1E] text-white' : 'bg-[#1c1c1c] text-zinc-400'}`}>
                    Minha Conta
                  </button>
                  {isSuperAdmin && (
                    <button onClick={() => { setSubAbaConfig('empresas'); fetchCompanies(); }} className={`px-3 py-1.5 rounded-lg text-xs font-semibold whitespace-nowrap ${subAbaConfig === 'empresas' ? 'bg-blue-600 text-white' : 'bg-[#1c1c1c] text-blue-400'}`}>
                      Gestão Cozinhas (B2B)
                    </button>
                  )}

                {subAbaConfig === 'exclusoes' && (!isSuperAdmin || impersonatedCompany) && (
                  <div>
                    <h1 className="text-xl sm:text-2xl font-bold text-white mb-1">Lixeira de Exclusões</h1>

                        <table className="w-full text-left text-xs text-zinc-400 min-w-[500px]">
                          <thead className="border-b border-[#262626]">
                            <tr><th className="pb-2.5 uppercase">Data</th><th className="pb-2.5 uppercase">Descrição</th><th className="pb-2.5 uppercase text-right">Valor</th><th className="pb-2.5 uppercase text-red-400 pl-4">Motivo</th></tr>
                          </thead>
                          <tbody className="divide-y divide-[#262626]">
                            {lancamentosExcluidos.map(l => (
                              <tr key={l.id} className="hover:bg-[#1c1c1c]">
                                <td className="py-2.5">{l.data}</td>
                                <td className="py-2.5 text-zinc-400 line-through">{l.descricao}</td>
                                <td className="py-2.5 text-right text-zinc-400 line-through">R$ {Number(l.valor_total).toFixed(2)}</td>
                                <td className="py-2.5 text-red-400 font-bold pl-4">{l.motivo_exclusao}</td>
                              </tr>
                            ))}
                          </tbody>
                        </table>
                      )}
                    </div>
                  </div>
                )}

                {subAbaConfig === 'empresas' && isSuperAdmin && (
                  <div>
                    <h1 className="text-xl sm:text-2xl font-bold text-white mb-4">Gestão de Clientes (B2B)</h1>
                    <form onSubmit={handleCreateCompanyB2B} className="bg-[#161616] border border-[#262626] p-4 sm:p-6 rounded-xl mb-6 space-y-3">
                      <h2 className="text-xs font-bold text-blue-400 uppercase tracking-wider">Registar Nova Cozinha</h2>
                      <div className="grid grid-cols-1 sm:grid-cols-3 gap-2.5">
                        <input type="text" placeholder="Nome do Cliente" value={newCompanyName} onChange={e => setNewCompanyName(e.target.value)} className="bg-[#202020] border border-[#333] rounded-lg p-2.5 text-base md:text-xs text-white outline-none" required />
                        <input type="text" placeholder="ID Interno" value={newCompanySlug} onChange={e => setNewCompanySlug(e.target.value)} className="bg-[#202020] border border-[#333] rounded-lg p-2.5 text-base md:text-xs text-white outline-none" />
                        <input type="text" placeholder="WhatsApp / Telefone" value={newCompanyPhone} onChange={e => setNewCompanyPhone(e.target.value)} className="bg-[#202020] border border-[#333] rounded-lg p-2.5 text-base md:text-xs text-white outline-none" />
                      </div>
                      <div className="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
                        <input type="text" placeholder="Login" value={newCompanyAdminUser} onChange={e => setNewCompanyAdminUser(e.target.value)} className="bg-[#202020] border border-[#333] rounded-lg p-2.5 text-base md:text-xs text-white outline-none" required />
                        <input type="password" placeholder="Palavra-passe" value={newCompanyAdminPass} onChange={e => setNewCompanyAdminPass(e.target.value)} className="bg-[#202020] border border-[#333] rounded-lg p-2.5 text-base md:text-xs text-white outline-none" required />
                      </div>
                      <button type="submit" className="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-2.5 rounded-lg text-xs">Ativar Cozinha</button>
                    </form>

                    <div className="bg-[#161616] border border-[#262626] rounded-xl p-4">
                      <h2 className="text-xs font-bold text-zinc-400 uppercase tracking-wider mb-3">Cozinhas Registadas ({companiesList.length})</h2>
                      <div className="space-y-2">
                        {companiesList.map(comp => (
                          <div key={comp.id} className="bg-[#202020] p-3 rounded-lg border border-[#2d2d2d] flex flex-col sm:flex-row sm:items-center justify-between gap-2.5">
                            <div>
                              <p className="text-xs sm:text-sm font-bold text-white flex items-center gap-2">{comp.company_name} <span className={`text-[9px] px-1.5 py-0.2 rounded font-bold uppercase ${comp.status === 'ativo' ? 'bg-emerald-950 text-emerald-400' : 'bg-red-950 text-red-400'}`}>{comp.status}</span></p>
                              <p className="text-[10px] text-zinc-500 font-mono">ID: {comp.company_id}</p>
                            </div>
                            <div className="flex items-center gap-2">
                              <button onClick={() => handleStartImpersonation(comp)} className="flex-1 sm:flex-initial bg-amber-500/10 text-amber-400 border border-amber-500/30 px-3 py-1.5 rounded-lg text-xs font-bold">Aceder Painel ↗</button>
                              <button onClick={() => handleToggleCompanyStatus(comp.id, comp.status)} className="bg-zinc-800 text-zinc-300 px-3 py-1.5 rounded-lg text-xs font-medium">{comp.status === 'ativo' ? 'Suspender' : 'Reativar'}</button>
                            </div>
                          </div>
                        ))}
                      </div>
                    </div>
                  </div>
                )}

                {/* SUB-ABA: CONTA & SESSÃO COM FOTO DE PERFIL RESPONSIVA */}
                {subAbaConfig === 'conta' && (
                  <div className="bg-[#161616] border border-[#262626] p-5 sm:p-8 rounded-2xl w-full">
                    <div className="flex flex-col lg:flex-row gap-6 sm:gap-10">
                      <div className="flex flex-col items-center shrink-0">
                        <div className="relative group mb-3">
                          <div className="w-24 h-24 sm:w-32 sm:h-32 rounded-full overflow-hidden bg-[#111111] border-2 border-[#D95B1E] shadow-xl flex items-center justify-center">
                            {currentUser?.avatar_url ? (
                              <img src={currentUser.avatar_url} alt="Perfil" className="w-full h-full object-cover" />
                            ) : (
                              <span className="text-4xl sm:text-5xl font-black text-[#D95B1E] uppercase">
                                {currentUser?.username ? currentUser.username.charAt(0) : '?'}
                              </span>
                            )}
                          </div>
                          <button onClick={() => avatarInputRef.current?.click()} className="absolute inset-0 bg-black/60 rounded-full flex flex-col items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity text-white text-[11px] font-semibold cursor-pointer">
                            Mudar Foto
                          </button>
                          <input type="file" accept="image/*" ref={avatarInputRef} onChange={handleAvatarUpload} className="hidden" />
                        </div>
                        <div className="flex items-center gap-3">
                          <button onClick={() => avatarInputRef.current?.click()} className="text-xs text-[#D95B1E] hover:text-[#c34e17] font-semibold">Alterar foto</button>
                          {currentUser?.avatar_url && <button onClick={handleRemoveAvatar} className="text-xs text-zinc-500 hover:text-red-400">Remover</button>}
                        </div>
                      </div>

                      <div className="flex-1 w-full border-t lg:border-t-0 lg:border-l border-[#262626] pt-5 lg:pt-0 lg:pl-10">
                        <h1 className="text-lg sm:text-2xl font-bold text-white mb-1 sm:mb-2">Informações da Sessão</h1>
                        <p className="text-[11px] sm:text-xs text-zinc-400 mb-5">Gestão das credenciais ativas do sistema.</p>
                        <div className="space-y-3 sm:space-y-5">
                          <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                            <div className="bg-[#1f1f1f] border border-[#2d2d2d] rounded-xl p-3.5">
                              <span className="text-[10px] uppercase font-bold text-zinc-500 block mb-0.5">Utilizador</span>
                              <span className="font-bold text-white text-sm sm:text-base">{currentUser?.username}</span>
                            </div>
                            <div className="bg-[#1f1f1f] border border-[#2d2d2d] rounded-xl p-3.5">
                              <span className="text-[10px] uppercase font-bold text-zinc-500 block mb-0.5">Função</span>
                              <span className="font-bold text-[#D95B1E] uppercase text-sm sm:text-base">{currentUser?.role}</span>
                            </div>
                          </div>
                          <div className="bg-[#1f1f1f] border border-[#2d2d2d] rounded-xl p-3.5">
                            <span className="text-[10px] uppercase font-bold text-zinc-500 block mb-0.5">Unidade Ativa</span>
                            <span className="font-bold text-white text-sm sm:text-lg block truncate">{effectiveCompanyName}</span>
                          </div>
                        </div>
                      </div>
                    </div>
                  </div>
                )}
              </div>
            )}
          </main>

          {/* CURSOR MULTIPLAYER (DESKTOP) */}
          {window.LiveCursorComponent && isSupportSessionActive && (
            <window.LiveCursorComponent 
              companyId={effectiveCompanyId}
              currentUsername={currentUser?.username}
              currentUserRole={currentUser?.role}
              targetUsername={isSuperAdmin ? 'cozinha' : 'admin'}
              isActive={isSupportSessionActive}
              supabaseClient={supabaseClient}
            />
          )}

          {/* CHAT DE SUPORTE */}
          {window.SupportChatComponent && isSupportSessionActive && (
            <window.SupportChatComponent 
              companyId={effectiveCompanyId}
              currentUsername={currentUser?.username}
              currentUserRole={currentUser?.role}
              operatorUsername={isSuperAdmin ? 'cozinha' : currentUser?.username}
              isVisible={isSupportSessionActive}
              supabaseClient={supabaseClient}
            />
          )}

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
