<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FoodStrick | Plataforma de Gestão Gastronômica</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body { background-color: #0f0f0f; color: #f5f5f5; font-family: sans-serif; }
    .btn-orange { background-color: #D95B1E; color: white; }
    .btn-orange:hover { background-color: #c34e17; }
    .text-orange { color: #D95B1E; }
    .text-green { color: #4A6332; }
    
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #333; border-radius: 10px; }
    ::-webkit-scrollbar-thumb:hover { background: #555; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;
    
    // SUAS CREDENCIAIS DO SUPABASE CONECTADAS
    const SUPABASE_URL = 'https://ddngvelrtqmfgaeqsjem.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_EhLCuypZr6vHrSKDCrHxQg_n7BvKxBU';
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const LOGIN_BG_IMAGE = "https://images.unsplash.com/photo-1555396273-367ea4eb4db5?q=80&w=1920&auto=format&fit=crop";

    function App() {
      const [isAuthenticated, setIsAuthenticated] = useState(false);
      const [currentUser, setCurrentUser] = useState(null);

      // Modo Suporte (Super Admin espelhando uma cozinha)
      const [impersonatedCompany, setImpersonatedCompany] = useState(null);

      // Estados de Login
      const [username, setUsername] = useState('');
      const [password, setPassword] = useState('');
      const [showPassword, setShowPassword] = useState(false);
      const [authError, setAuthError] = useState('');

      // Navegação
      const [abaAtiva, setAbaAtiva] = useState('painel'); 
      const [subAbaConfig, setSubAbaConfig] = useState('exclusoes'); 

      // Dados Operacionais
      const [produtos, setProdutos] = useState([]);
      const [lancamentos, setLancamentos] = useState([]);
      const [carregando, setCarregando] = useState(false);

      // Modais
      const [modalExclusao, setModalExclusao] = useState({ aberto: false, idLancamento: null });
      const [motivoExclusao, setMotivoExclusao] = useState('Pedido cancelado');
      const [modalExcluirProduto, setModalExcluirProduto] = useState({ aberto: false, idProduto: null, nome: '' });

      // Formulários
      const [novoLancamento, setNovoLancamento] = useState({
        data: new Date().toISOString().split('T')[0],
        tipo: 'Venda', produto_id: '', descricao: '', quantidade: 1, 
        pagamento: 'Pix', canal_categoria: 'Delivery', valor_despesa: '', fornecedor: ''
      });

      const [novoProduto, setNovoProduto] = useState({
        nome: '', preco_venda: '', custo_unitario: '', observacao: ''
      });

      // Gestão de Cozinhas B2B (Super Admin)
      const [companiesList, setCompaniesList] = useState([]);
      const [newCompanyName, setNewCompanyName] = useState('');
      const [newCompanySlug, setNewCompanySlug] = useState('');
      const [newCompanyPhone, setNewCompanyPhone] = useState('');
      const [newCompanyAdminUser, setNewCompanyAdminUser] = useState('');
      const [newCompanyAdminPass, setNewCompanyAdminPass] = useState('');

      const isSuperAdmin = currentUser?.role === 'superadmin';
      const effectiveCompanyId = impersonatedCompany ? impersonatedCompany.company_id : currentUser?.company_id;

      // Recuperar sessão salva no navegador
      useEffect(() => {
        const saved = localStorage.getItem('foodstrick_user');
        if (saved) {
          try {
            const parsed = JSON.parse(saved);
            setCurrentUser(parsed);
            setIsAuthenticated(true);
            if (parsed.role === 'superadmin') {
              setAbaAtiva('configuracoes');
              setSubAbaConfig('empresas');
              fetchCompanies();
            }
          } catch (e) {
            console.error(e);
          }
        }
      }, []);

      // Atualizar dados da cozinha ativa
      useEffect(() => {
        if (isAuthenticated && effectiveCompanyId && effectiveCompanyId !== 'foodstrick-master') {
          carregarDadosOperacionais(effectiveCompanyId);
        }
      }, [isAuthenticated, effectiveCompanyId]);

      async function carregarDadosOperacionais(compId) {
        setCarregando(true);
        try {
          const { data: prods } = await supabaseClient.from('produtos').select('*').eq('company_id', compId).order('nome');
          const { data: lancs } = await supabaseClient.from('lancamentos').select('*').eq('company_id', compId).order('data', { ascending: false });
          if (prods) setProdutos(prods);
          if (lancs) setLancamentos(lancs);
        } catch (err) {
          console.error(err);
        }
        setCarregando(false);
      }

      // --- LOGIN ---
      const handleLogin = async (e) => {
        e.preventDefault();
        setAuthError('');
        const cleanUser = username.trim().toLowerCase();

        // 1. Super Admin Mestre
        if (cleanUser === 'admin' && password === 'admin123') {
          const superAdminObj = { username: 'admin', role: 'superadmin', company_id: 'foodstrick-master' };
          localStorage.setItem('foodstrick_user', JSON.stringify(superAdminObj));
          setCurrentUser(superAdminObj);
          setIsAuthenticated(true);
          setAbaAtiva('configuracoes');
          setSubAbaConfig('empresas');
          fetchCompanies();
          return;
        }

        // 2. Cozinhas e Operadores
        const { data: userData } = await supabaseClient
          .from('app_users')
          .select('*')
          .ilike('username', cleanUser)
          .eq('password', password)
          .maybeSingle();

        if (userData) {
          const { data: comp } = await supabaseClient
            .from('companies')
            .select('*')
            .eq('company_id', userData.company_id)
            .maybeSingle();

          if (comp && comp.status === 'bloqueado') {
            setAuthError('Acesso suspenso: este restaurante/cozinha está temporariamente bloqueado.');
            return;
          }

          const userObj = {
            username: userData.username,
            role: userData.role || 'operador',
            company_id: userData.company_id
          };

          localStorage.setItem('foodstrick_user', JSON.stringify(userObj));
          setCurrentUser(userObj);
          setIsAuthenticated(true);
          setAbaAtiva('painel');
          return;
        }

        setAuthError('Usuário ou senha incorretos.');
      };

      const handleLogout = () => {
        localStorage.removeItem('foodstrick_user');
        setIsAuthenticated(false);
        setCurrentUser(null);
        setImpersonatedCompany(null);
        setUsername('');
        setPassword('');
        setProdutos([]);
        setLancamentos([]);
      };

      // Cálculos Financeiros
      const lancamentosAtivos = lancamentos.filter(l => l.status !== 'excluido');
      const lancamentosExcluidos = lancamentos.filter(l => l.status === 'excluido');

      const faturamento = lancamentosAtivos.filter(l => l.tipo === 'Venda').reduce((acc, curr) => acc + Number(curr.valor_total), 0);
      const lucroProdutos = lancamentosAtivos.filter(l => l.tipo === 'Venda').reduce((acc, curr) => acc + (Number(curr.valor_total) - Number(curr.custo_total)), 0);
      const totalDespesas = lancamentosAtivos.filter(l => l.tipo === 'Despesa').reduce((acc, curr) => acc + Number(curr.valor_total), 0);
      const resultadoMes = lucroProdutos - totalDespesas;

      // Gravar Lançamento
      async function handleSalvarLancamento(e) {
        e.preventDefault();
        if (!effectiveCompanyId) return;

        let total = 0, custo = 0, desc = novoLancamento.descricao;
        if (novoLancamento.tipo === 'Venda') {
          const prod = produtos.find(p => p.id === novoLancamento.produto_id);
          if (!prod) return alert('Selecione um produto.');
          desc = prod.nome;
          total = Number(prod.preco_venda) * Number(novoLancamento.quantidade);
          custo = Number(prod.custo_unitario) * Number(novoLancamento.quantidade);
        } else {
          total = Number(novoLancamento.valor_despesa);
        }

        const payload = {
          company_id: effectiveCompanyId,
          data: novoLancamento.data,
          tipo: novoLancamento.tipo,
          descricao: desc,
          produto_id: novoLancamento.tipo === 'Venda' ? novoLancamento.produto_id : null,
          quantidade: novoLancamento.tipo === 'Venda' ? Number(novoLancamento.quantidade) : null,
          pagamento: novoLancamento.pagamento,
          canal_categoria: novoLancamento.canal_categoria,
          valor_total: total,
          custo_total: custo,
          resultado: novoLancamento.tipo === 'Venda' ? total - custo : -total,
          fornecedor: novoLancamento.tipo === 'Despesa' ? novoLancamento.fornecedor : null,
          status: 'ativo'
        };

        const { error } = await supabaseClient.from('lancamentos').insert([payload]);
        if (error) alert("Erro: " + error.message);
        else {
          carregarDadosOperacionais(effectiveCompanyId);
          setNovoLancamento({ ...novoLancamento, descricao: '', valor_despesa: '', quantidade: 1, produto_id: '', fornecedor: '' });
        }
      }

      // Exclusão de Lançamento
      async function confirmarExclusao() {
        if (!modalExclusao.idLancamento) return;
        const { error } = await supabaseClient
          .from('lancamentos')
          .update({ status: 'excluido', motivo_exclusao: motivoExclusao })
          .eq('id', modalExclusao.idLancamento);

        if (error) alert("Erro: " + error.message);
        else {
          carregarDadosOperacionais(effectiveCompanyId);
          setModalExclusao({ aberto: false, idLancamento: null });
        }
      }

      // Gravar Produto
      async function handleSalvarProduto(e) {
        e.preventDefault();
        if (!effectiveCompanyId) return;

        const payload = {
          company_id: effectiveCompanyId,
          nome: novoProduto.nome,
          preco_venda: parseFloat(novoProduto.preco_venda),
          custo_unitario: parseFloat(novoProduto.custo_unitario),
          observacao: novoProduto.observacao
        };

        const { error } = await supabaseClient.from('produtos').insert([payload]);
        if (error) alert("Erro: " + error.message);
        else {
          carregarDadosOperacionais(effectiveCompanyId);
          setNovoProduto({ nome: '', preco_venda: '', custo_unitario: '', observacao: '' });
        }
      }

      // Deletar Produto
      async function deletarProduto(id) {
        const temLancamentos = lancamentos.some(l => l.produto_id === id);
        if (temLancamentos) {
          alert("Atenção: Este produto possui vendas registradas e não pode ser apagado para não quebrar seu histórico financeiro.");
          setModalExcluirProduto({ aberto: false, idProduto: null, nome: '' });
          return;
        }

        const { error } = await supabaseClient.from('produtos').delete().eq('id', id);
        if (error) alert("Erro: " + error.message);
        else {
          carregarDadosOperacionais(effectiveCompanyId);
          setModalExcluirProduto({ aberto: false, idProduto: null, nome: '' });
        }
      }

      // Super Admin: Empresas B2B
      const fetchCompanies = async () => {
        const { data } = await supabaseClient.from('companies').select('*').order('created_at', { ascending: false });
        if (data) setCompaniesList(data);
      };

      const handleCreateCompanyB2B = async (e) => {
        e.preventDefault();
        const cleanName = newCompanyName.trim();
        let cleanSlug = newCompanySlug.trim().toLowerCase().replace(/[^a-z0-9-]/g, '-');
        const cleanAdmin = newCompanyAdminUser.trim().toLowerCase();
        const cleanPass = newCompanyAdminPass.trim();

        if (!cleanSlug) {
          cleanSlug = cleanName.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-z0-9]+/g, '-');
        }

        const { error: compError } = await supabaseClient.from('companies').insert([
          { company_id: cleanSlug, company_name: cleanName, contact_phone: newCompanyPhone.trim(), status: 'ativo' }
        ]);

        if (compError) return alert("Erro ao criar cozinha: " + compError.message);

        await supabaseClient.from('app_users').insert([
          { username: cleanAdmin, password: cleanPass, role: 'admin', company_id: cleanSlug }
        ]);

        alert(`Restaurante/Cozinha "${cleanName}" cadastrado com sucesso!`);
        setNewCompanyName(''); setNewCompanySlug(''); setNewCompanyPhone(''); setNewCompanyAdminUser(''); setNewCompanyAdminPass('');
        fetchCompanies();
      };

      const handleToggleCompanyStatus = async (id, currentStatus) => {
        const nextStatus = currentStatus === 'ativo' ? 'bloqueado' : 'ativo';
        await supabaseClient.from('companies').update({ status: nextStatus }).eq('id', id);
        fetchCompanies();
      };

      // ==========================
      // TELA DE LOGIN FOODSTRICK
      // ==========================
      if (!isAuthenticated) {
        return (
          <div 
            className="min-h-screen w-full flex items-center justify-start p-6 md:p-16 lg:p-24 relative bg-cover bg-center"
            style={{ backgroundImage: `url("${LOGIN_BG_IMAGE}")` }}
          >
            <div className="absolute inset-0 bg-black/65 backdrop-blur-sm" />

            <div className="relative z-10 w-full max-w-sm bg-[#161616] rounded-2xl shadow-2xl border border-[#2d2d2d] p-8 text-white">
              <div className="flex items-center gap-3 pb-6 border-b border-[#2d2d2d] mb-6">
                <div className="w-12 h-12 rounded-xl bg-[#D95B1E] flex items-center justify-center text-white shadow-lg shadow-[#D95B1E]/30">
                  <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"/></svg>
                </div>
                <div>
                  <h1 className="text-2xl font-black italic tracking-wider text-white">FoodStrick</h1>
                  <p className="text-[10px] text-zinc-400 font-semibold uppercase tracking-widest">Gestão Gastronômica</p>
                </div>
              </div>

              {authError && (
                <div className="mb-4 p-3 bg-red-950/60 border border-red-800 text-red-300 rounded-lg text-xs font-medium text-center">
                  {authError}
                </div>
              )}

              <form onSubmit={handleLogin} className="space-y-4">
                <div>
                  <label className="block text-xs font-medium text-zinc-400 mb-1">Usuário / Operador</label>
                  <input 
                    type="text"
                    placeholder="admin ou seu_login"
                    value={username}
                    onChange={(e) => setUsername(e.target.value)}
                    className="w-full bg-[#202020] text-white text-sm px-4 py-2.5 rounded-lg border border-[#333] focus:border-[#D95B1E] outline-none"
                    required
                  />
                </div>

                <div className="relative">
                  <label className="block text-xs font-medium text-zinc-400 mb-1">Senha</label>
                  <input 
                    type={showPassword ? "text" : "password"}
                    placeholder="••••••••"
                    value={password}
                    onChange={(e) => setPassword(e.target.value)}
                    className="w-full bg-[#202020] text-white text-sm px-4 py-2.5 pr-10 rounded-lg border border-[#333] focus:border-[#D95B1E] outline-none"
                    required
                  />
                  <button 
                    type="button"
                    onClick={() => setShowPassword(!showPassword)}
                    className="absolute right-3 top-8 text-zinc-400 hover:text-white"
                  >
                    {showPassword ? "👁️" : "🙈"}
                  </button>
                </div>

                <button 
                  type="submit"
                  className="w-full btn-orange font-bold py-3 rounded-lg text-sm tracking-wide shadow-lg transition-all mt-2"
                >
                  Entrar no Sistema
                </button>
              </form>

              <div className="mt-6 text-center text-xs text-zinc-500">
                FoodStrick • Plataforma Multi-Cozinhas v2.0
              </div>
            </div>
          </div>
        );
      }

      // ==========================
      // SISTEMA PRINCIPAL
      // ==========================
      return (
        <div className="flex flex-col md:flex-row min-h-screen relative">

          {/* MODAL DE EXCLUSÃO DE LANÇAMENTO */}
          {modalExclusao.aberto && (
            <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/80 backdrop-blur-sm p-4">
              <div className="bg-[#171717] border border-[#333] rounded-xl p-6 w-full max-w-md shadow-2xl">
                <h3 className="text-lg font-bold text-white mb-2">Excluir Lançamento</h3>
                <p className="text-xs text-zinc-400 mb-5">Escolha o motivo. Este item sairá do caixa ativo e irá para a Lixeira.</p>
                <div className="space-y-2 mb-6">
                  {['Pedido cancelado', 'Erro de principiante', 'Erro técnico', 'Outro'].map(motivo => (
                    <label key={motivo} className={`flex items-center p-3 border rounded-lg cursor-pointer transition-colors ${motivoExclusao === motivo ? 'border-[#D95B1E] bg-[#D95B1E]/10' : 'border-[#2d2d2d] hover:bg-[#202020]'}`}>
                      <input type="radio" name="motivo" value={motivo} checked={motivoExclusao === motivo} onChange={(e) => setMotivoExclusao(e.target.value)} className="text-[#D95B1E]" />
                      <span className="ml-3 text-xs text-white font-medium">{motivo}</span>
                    </label>
                  ))}
                </div>
                <div className="flex justify-end gap-3">
                  <button onClick={() => setModalExclusao({ aberto: false, idLancamento: null })} className="px-4 py-2 text-xs font-semibold text-zinc-400 hover:text-white">Cancelar</button>
                  <button onClick={confirmarExclusao} className="px-4 py-2 bg-red-600 hover:bg-red-700 text-white rounded-lg text-xs font-bold">Confirmar Exclusão</button>
                </div>
              </div>
            </div>
          )}

          {/* MODAL DE EXCLUSÃO DE PRODUTO */}
          {modalExcluirProduto.aberto && (
            <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/80 backdrop-blur-sm p-4">
              <div className="bg-[#171717] border border-[#333] rounded-xl p-6 w-full max-w-md shadow-2xl">
                <h3 className="text-lg font-bold text-white mb-2">Deletar Produto</h3>
                <p className="text-xs text-zinc-400 mb-6">
                  Deseja remover <strong className="text-white">"{modalExcluirProduto.nome}"</strong>? Produtos com histórico de vendas não podem ser apagados.
                </p>
                <div className="flex justify-end gap-3">
                  <button onClick={() => setModalExcluirProduto({ aberto: false, idProduto: null, nome: '' })} className="px-4 py-2 text-xs font-semibold text-zinc-400 hover:text-white">Cancelar</button>
                  <button onClick={() => deletarProduto(modalExcluirProduto.idProduto)} className="px-4 py-2 bg-red-600 hover:bg-red-700 text-white rounded-lg text-xs font-bold">Deletar Produto</button>
                </div>
              </div>
            </div>
          )}

          {/* SIDEBAR PRINCIPAL */}
          <aside className="w-full md:w-64 bg-[#141414] border-r border-[#242424] p-5 flex flex-col justify-between shrink-0 h-screen sticky top-0 overflow-y-auto">
            <div>
              <div className="flex items-center gap-3 pb-6 border-b border-[#242424]">
                <div className="w-10 h-10 rounded-xl bg-[#D95B1E] flex items-center justify-center text-white shadow-md shadow-[#D95B1E]/30">
                  <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"/></svg>
                </div>
                <div>
                  <h2 className="text-lg font-black tracking-tight text-white">FoodStrick</h2>
                  <span className="text-[10px] text-zinc-500 uppercase tracking-widest block font-semibold truncate max-w-[130px]">
                    {impersonatedCompany ? impersonatedCompany.company_name : (currentUser?.company_id || 'Gestão')}
                  </span>
                </div>
              </div>

              <nav className="mt-6 space-y-1.5">
                <button 
                  onClick={() => setAbaAtiva('painel')}
                  className={`w-full flex items-center gap-3 px-3.5 py-2.5 rounded-lg text-xs font-semibold transition-all ${abaAtiva === 'painel' ? 'btn-orange shadow-md' : 'text-zinc-400 hover:bg-[#202020] hover:text-white'}`}
                >
                  <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/><polyline points="16 7 22 7 22 13"/></svg>
                  Painel Geral
                </button>
                <button 
                  onClick={() => setAbaAtiva('lancamentos')}
                  className={`w-full flex items-center gap-3 px-3.5 py-2.5 rounded-lg text-xs font-semibold transition-all ${abaAtiva === 'lancamentos' ? 'btn-orange shadow-md' : 'text-zinc-400 hover:bg-[#202020] hover:text-white'}`}
                >
                  <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M4 2v20l2-1 2 1 2-1 2 1 2-1 2 1 2-1 2 1V2l-2 1-2-1-2 1-2-1-2 1-2-1Z"/><path d="M16 8h-6a2 2 0 1 0 0 4h4a2 2 0 1 1 0 4H8"/><path d="M12 17V7"/></svg>
                  Lançamentos
                </button>
                <button 
                  onClick={() => setAbaAtiva('produtos')}
                  className={`w-full flex items-center gap-3 px-3.5 py-2.5 rounded-lg text-xs font-semibold transition-all ${abaAtiva === 'produtos' ? 'btn-orange shadow-md' : 'text-zinc-400 hover:bg-[#202020] hover:text-white'}`}
                >
                  <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m7.5 4.27 9 5.15"/><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/><path d="m3.3 7 8.7 5 8.7-5"/><path d="M12 22V12"/></svg>
                  Produtos & Custos
                </button>
              </nav>
            </div>

            <div className="pt-4 border-t border-[#242424] space-y-2">
              <button 
                onClick={() => setAbaAtiva('configuracoes')}

                      <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
                        <input type="text" placeholder="Nome Fantasia (Ex: Cozinha Brasileira)" value={newCompanyName} onChange={e => setNewCompanyName(e.target.value)} className="bg-[#202020] border border-[#333] rounded-lg p-2.5 text-xs text-white" required />
                        <input type="text" placeholder="ID Único / Slug (Ex: cozinha-brasileira)" value={newCompanySlug} onChange={e => setNewCompanySlug(e.target.value)} className="bg-[#202020] border border-[#333] rounded-lg p-2.5 text-xs text-white font-mono" />
                        <input type="text" placeholder="Telefone / WhatsApp" value={newCompanyPhone} onChange={e => setNewCompanyPhone(e.target.value)} className="bg-[#202020] border border-[#333] rounded-lg p-2.5 text-xs text-white" />
                      </div>
                      <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                        <input type="text" placeholder="Login do Gerente" value={newCompanyAdminUser} onChange={e => setNewCompanyAdminUser(e.target.value)} className="bg-[#202020] border border-[#333] rounded-lg p-2.5 text-xs text-white" required />
                        <input type="password" placeholder="Senha Inicial (min. 4 dígitos)" value={newCompanyAdminPass} onChange={e => setNewCompanyAdminPass(e.target.value)} className="bg-[#202020] border border-[#333] rounded-lg p-2.5 text-xs text-white" required />
                      </div>
                      <div className="text-right">
                        <button type="submit" className="bg-blue-600 hover:bg-blue-500 text-white font-bold px-4 py-2 rounded-lg text-xs">
                          Ativar Nova Cozinha
                        </button>
                      </div>
                    </form>

                    <div className="bg-[#161616] border border-[#262626] rounded-xl p-5">
                      <h2 className="text-xs font-bold text-zinc-400 uppercase tracking-wider mb-4">Cozinhas Ativas ({companiesList.length})</h2>
                      <div className="space-y-2">
                        {companiesList.map(comp => (
                          <div key={comp.id} className="bg-[#202020] p-3.5 rounded-lg border border-[#2d2d2d] flex justify-between items-center">
                            <div>
                              <p className="text-sm font-bold text-white flex items-center gap-2">
                                {comp.company_name}
                                <span className={`text-[9px] px-2 py-0.5 rounded font-bold uppercase ${comp.status === 'ativo' ? 'bg-emerald-950 text-emerald-400' : 'bg-red-950 text-red-400'}`}>
                                  {comp.status}
                                </span>
                              </p>
                              <p className="text-[11px] text-zinc-500 font-mono mt-0.5">ID: {comp.company_id} | Tel: {comp.contact_phone || '-'}</p>
                            </div>
                            <div className="flex items-center gap-2">
                              <button onClick={() => { setImpersonatedCompany(comp); setAbaAtiva('painel'); }} className="bg-amber-500/10 hover:bg-amber-500/20 text-amber-400 border border-amber-500/30 px-3 py-1.5 rounded-lg text-xs font-bold flex items-center gap-1.5">
                                Acessar Painel ↗
                              </button>
                              <button onClick={() => handleToggleCompanyStatus(comp.id, comp.status)} className="bg-zinc-800 hover:bg-zinc-700 text-zinc-300 px-3 py-1.5 rounded-lg text-xs font-medium">
                                {comp.status === 'ativo' ? 'Bloquear' : 'Reativar'}
                              </button>
                            </div>
                          </div>
                        ))}
                      </div>
                    </div>
                  </div>
                )}

                {/* SUB-ABA: CONTA */}
                {subAbaConfig === 'conta' && (
                  <div className="bg-[#161616] border border-[#262626] p-6 rounded-xl max-w-xl">
                    <h1 className="text-base font-bold text-white mb-4">Informações da Sessão</h1>
                    <div className="space-y-2 text-xs text-zinc-300">
                      <div className="flex justify-between py-2 border-b border-[#242424]">
                        <span className="text-zinc-500">Usuário Conectado:</span>
                        <span className="font-bold text-white">{currentUser?.username}</span>
                      </div>
                      <div className="flex justify-between py-2 border-b border-[#242424]">
                        <span className="text-zinc-500">Nível de Acesso:</span>
                        <span className="text-amber-400 font-bold uppercase">{currentUser?.role}</span>
                      </div>
                      <div className="flex justify-between py-2 border-b border-[#242424]">
                        <span className="text-zinc-500">Identificador da Cozinha:</span>
                        <span className="font-mono text-blue-400">{currentUser?.company_id}</span>
                      </div>
                    </div>
                  </div>
                )}
              </div>
            )}

          </main>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
