<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cozinha Brasileira | Gestão Operacional</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body { background-color: #0f0f0f; color: #f5f5f5; font-family: sans-serif; }
    .btn-orange { background-color: #D95B1E; color: white; }
    .btn-orange:hover { background-color: #c34e17; }
    .text-orange { color: #D95B1E; }
    .text-green { color: #4A6332; }
    
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #333; border-radius: 10px; }
    ::-webkit-scrollbar-thumb:hover { background: #555; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;
    
    // CREDENCIAIS DO SUPABASE
    const SUPABASE_URL = 'https://ddngvelrtqmfgaeqsjem.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_EhLCuypZr6vHrSKDCrHxQg_n7BvKxBU';
    
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    function App() {
      // Abas de navegação
      const [abaAtiva, setAbaAtiva] = useState('painel');
      const [subAbaAtiva, setSubAbaAtiva] = useState('exclusoes');

      const [produtos, setProdutos] = useState([]);
      const [lancamentos, setLancamentos] = useState([]);
      const [carregando, setCarregando] = useState(true);

      // Modais
      const [modalExclusao, setModalExclusao] = useState({ aberto: false, idLancamento: null });
      const [motivoExclusao, setMotivoExclusao] = useState('Pedido cancelado');
      
      const [modalExcluirProduto, setModalExcluirProduto] = useState({ aberto: false, idProduto: null, nome: '' });

      const [novoLancamento, setNovoLancamento] = useState({
        data: new Date().toISOString().split('T')[0],
        tipo: 'Venda', produto_id: '', descricao: '', quantidade: 1, 
        pagamento: 'Pix', canal_categoria: 'Delivery', valor_despesa: '', fornecedor: ''
      });

      const [novoProduto, setNovoProduto] = useState({
        nome: '', preco_venda: '', custo_unitario: '', observacao: ''
      });

      useEffect(() => { carregarDados(); }, []);

      async function carregarDados() {
        setCarregando(true);
        try {
          const { data: prods } = await supabaseClient.from('produtos').select('*').order('nome');
          const { data: lancs } = await supabaseClient.from('lancamentos').select('*').order('data', { ascending: false });
          if (prods) setProdutos(prods);
          if (lancs) setLancamentos(lancs);
        } catch (error) {
          console.error("Erro:", error);
        }
        setCarregando(false);
      }

      const lancamentosAtivos = lancamentos.filter(l => l.status !== 'excluido');
      const lancamentosExcluidos = lancamentos.filter(l => l.status === 'excluido');

      const faturamento = lancamentosAtivos.filter(l => l.tipo === 'Venda').reduce((acc, curr) => acc + Number(curr.valor_total), 0);
      const lucroProdutos = lancamentosAtivos.filter(l => l.tipo === 'Venda').reduce((acc, curr) => acc + (Number(curr.valor_total) - Number(curr.custo_total)), 0);
      const totalDespesas = lancamentosAtivos.filter(l => l.tipo === 'Despesa').reduce((acc, curr) => acc + Number(curr.valor_total), 0);
      const resultadoMes = lucroProdutos - totalDespesas;

      // === LANÇAMENTOS ===
      async function handleSalvarLancamento(e) {
        e.preventDefault();
        let total = 0, custo = 0, desc = novoLancamento.descricao;
        
        if (novoLancamento.tipo === 'Venda') {
          const prod = produtos.find(p => p.id === novoLancamento.produto_id);
          if (!prod) return alert('Selecione um produto.');
          desc = prod.nome;
          total = Number(prod.preco_venda) * Number(novoLancamento.quantidade);
          custo = Number(prod.custo_unitario) * Number(novoLancamento.quantidade);
        } else {
          total = Number(novoLancamento.valor_despesa);
        }
        
        const payload = {
          data: novoLancamento.data, tipo: novoLancamento.tipo, descricao: desc,
          produto_id: novoLancamento.tipo === 'Venda' ? novoLancamento.produto_id : null,
          quantidade: novoLancamento.tipo === 'Venda' ? Number(novoLancamento.quantidade) : null,
          pagamento: novoLancamento.pagamento, canal_categoria: novoLancamento.canal_categoria,
          valor_total: total, custo_total: custo,
          resultado: novoLancamento.tipo === 'Venda' ? total - custo : -total,
          fornecedor: novoLancamento.tipo === 'Despesa' ? novoLancamento.fornecedor : null,
          status: 'ativo'
        };

        const { error } = await supabaseClient.from('lancamentos').insert([payload]);
        if(error) alert("Erro: " + error.message);
        else {
            carregarDados();
            setNovoLancamento({ ...novoLancamento, descricao: '', valor_despesa: '', quantidade: 1, produto_id: '', fornecedor: '' });
        }
      }

      async function confirmarExclusao() {
        if(!modalExclusao.idLancamento) return;
        const { error } = await supabaseClient.from('lancamentos').update({ status: 'excluido', motivo_exclusao: motivoExclusao }).eq('id', modalExclusao.idLancamento);
        if(error) alert("Erro: " + error.message);
        else {
          carregarDados();
          setModalExclusao({ aberto: false, idLancamento: null });
        }
      }

      // === PRODUTOS ===
      async function handleSalvarProduto(e) {
        e.preventDefault();
        const payload = {
          nome: novoProduto.nome, preco_venda: parseFloat(novoProduto.preco_venda),
          custo_unitario: parseFloat(novoProduto.custo_unitario), observacao: novoProduto.observacao
        };
        const { error } = await supabaseClient.from('produtos').insert([payload]);
        if(error) alert("Erro: " + error.message);
        else {
            carregarDados();
            setNovoProduto({ nome: '', preco_venda: '', custo_unitario: '', observacao: '' });
        }
      }

      async function deletarProduto(id) {
        // Verifica se o produto tem lançamentos vinculados a ele
        const temLancamentos = lancamentos.some(l => l.produto_id === id);
        
        if (temLancamentos) {
            alert("Atenção: Este produto não pode ser excluído permanentemente porque existem lançamentos de vendas associados a ele. Isso corromperia o seu histórico financeiro.");
            setModalExcluirProduto({ aberto: false, idProduto: null, nome: '' });
            return;
        }

        const { error } = await supabaseClient.from('produtos').delete().eq('id', id);
        if(error) {
            alert("Erro ao excluir produto: " + error.message);
        } else {
            carregarDados();
            setModalExcluirProduto({ aberto: false, idProduto: null, nome: '' });
        }
      }

      if(carregando && produtos.length === 0){
          return <div className="flex items-center justify-center min-h-screen text-white">Carregando sistema...</div>
      }

      return (
        <div className="flex flex-col md:flex-row min-h-screen relative">
          
          {/* MODAL DE EXCLUSÃO DE LANÇAMENTO */}
          {modalExclusao.aberto && (
            <div className="fixed inset-0 z-50 flex items-center justify-center bg-black bg-opacity-70 backdrop-blur-sm px-4">
              <div className="bg-[#171717] border border-[#333] rounded-xl p-6 w-full max-w-md shadow-2xl">
                <h3 className="text-xl font-bold text-white mb-2">Excluir Lançamento</h3>
                <p className="text-sm text-zinc-400 mb-6">Qual o motivo da exclusão deste registro? Ele será movido para a aba de Exclusões.</p>
                <div className="space-y-3 mb-6">
                  {['Pedido cancelado', 'Erro de principiante', 'Erro técnico', 'Outro'].map(motivo => (
                    <label key={motivo} className={`flex items-center p-3 border rounded-lg cursor-pointer transition-colors ${motivoExclusao === motivo ? 'border-[#D95B1E] bg-[#D95B1E]/10' : 'border-[#333] hover:bg-[#202020]'}`}>
                      <input type="radio" name="motivo" value={motivo} checked={motivoExclusao === motivo} onChange={(e) => setMotivoExclusao(e.target.value)} className="w-4 h-4 text-[#D95B1E] bg-[#202020] border-gray-600" />
                      <span className="ml-3 text-sm text-white font-medium">{motivo}</span>
                    </label>
                  ))}
                </div>
                <div className="flex justify-end gap-3">
                  <button onClick={() => setModalExclusao({ aberto: false, idLancamento: null })} className="px-4 py-2 rounded-lg text-sm font-medium text-zinc-400 hover:text-white transition-colors">Cancelar</button>
                  <button onClick={confirmarExclusao} className="px-4 py-2 bg-red-600 hover:bg-red-700 text-white rounded-lg text-sm font-medium transition-colors">Confirmar Exclusão</button>
                </div>
              </div>
            </div>
          )}

          {/* MODAL DE EXCLUSÃO DE PRODUTO */}
          {modalExcluirProduto.aberto && (
            <div className="fixed inset-0 z-50 flex items-center justify-center bg-black bg-opacity-70 backdrop-blur-sm px-4">
              <div className="bg-[#171717] border border-[#333] rounded-xl p-6 w-full max-w-md shadow-2xl">
                <h3 className="text-xl font-bold text-white mb-2">Deletar Produto</h3>
                <p className="text-sm text-zinc-400 mb-6">
                  Tem certeza que deseja apagar o produto <span className="text-white font-bold">"{modalExcluirProduto.nome}"</span>? <br/><br/>
                  <span className="text-rose-400">Nota: Produtos que já possuem vendas registradas não podem ser apagados para não quebrar o histórico financeiro.</span>
                </p>
                <div className="flex justify-end gap-3">
                  <button onClick={() => setModalExcluirProduto({ aberto: false, idProduto: null, nome: '' })} className="px-4 py-2 rounded-lg text-sm font-medium text-zinc-400 hover:text-white transition-colors">Cancelar</button>
                  <button onClick={() => deletarProduto(modalExcluirProduto.idProduto)} className="px-4 py-2 bg-red-600 hover:bg-red-700 text-white rounded-lg text-sm font-medium transition-colors">Deletar Produto</button>
                </div>
              </div>
            </div>
          )}

          {/* SIDEBAR PRINCIPAL */}
          <aside className="w-full md:w-[260px] bg-[#1c1c1c] border-r border-[#2d2d2d] flex flex-col justify-between h-screen sticky top-0 overflow-y-auto shrink-0 z-20">
            <div>
              <div className="flex flex-col items-center text-center p-6 border-b border-[#2d2d2d]">
                <div className="w-20 h-20 rounded-full border-2 border-[#D95B1E] bg-[#141414] flex items-center justify-center p-2 mb-3 shadow-lg">
                  <div className="text-center">
                    <span className="block text-green text-xs font-bold leading-tight uppercase">Cozinha</span>
                    <span className="block text-orange text-xs font-black tracking-wider uppercase">Brasileira</span>
                  </div>
                </div>
                <h1 className="text-sm font-semibold tracking-wide text-[#f2ece4]">COZINHA BRASILEIRA</h1>
              </div>
              
              <nav className="mt-4 px-3 space-y-1">
                <button onClick={() => setAbaAtiva('painel')} className={`w-full flex items-center gap-3 px-3 py-2.5 rounded-md text-sm font-medium transition-colors ${abaAtiva === 'painel' ? 'bg-[#333] text-white' : 'text-zinc-400 hover:bg-[#2a2a2a] hover:text-zinc-200'}`}>
                  <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect width="7" height="9" x="3" y="3" rx="1"/><rect width="7" height="5" x="14" y="3" rx="1"/><rect width="7" height="9" x="14" y="12" rx="1"/><rect width="7" height="5" x="3" y="16" rx="1"/></svg>
                  Painel Geral
                </button>
                <button onClick={() => setAbaAtiva('lancamentos')} className={`w-full flex items-center gap-3 px-3 py-2.5 rounded-md text-sm font-medium transition-colors ${abaAtiva === 'lancamentos' ? 'bg-[#333] text-white' : 'text-zinc-400 hover:bg-[#2a2a2a] hover:text-zinc-200'}`}>
                  <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M4 2v20l2-1 2 1 2-1 2 1 2-1 2 1 2-1 2 1V2l-2 1-2-1-2 1-2-1-2 1-2-1Z"/><path d="M16 8h-6a2 2 0 1 0 0 4h4a2 2 0 1 1 0 4H8"/><path d="M12 17V7"/></svg>
                  Lançamentos
                </button>
                <button onClick={() => setAbaAtiva('produtos')} className={`w-full flex items-center gap-3 px-3 py-2.5 rounded-md text-sm font-medium transition-colors ${abaAtiva === 'produtos' ? 'bg-[#333] text-white' : 'text-zinc-400 hover:bg-[#2a2a2a] hover:text-zinc-200'}`}>
                  <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m7.5 4.27 9 5.15"/><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/><path d="m3.3 7 8.7 5 8.7-5"/><path d="M12 22V12"/></svg>
                  Produtos & Custos
                </button>
              </nav>
            </div>

            <div className="p-3 border-t border-[#2d2d2d]">
              <button onClick={() => setAbaAtiva('configuracoes')} className={`w-full flex items-center gap-3 px-3 py-2.5 rounded-md text-sm font-medium transition-colors ${abaAtiva === 'configuracoes' ? 'bg-[#D95B1E] text-white' : 'text-zinc-400 hover:bg-[#2a2a2a] hover:text-zinc-200'}`}>
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
                Configurações
              </button>
            </div>
          </aside>

          {/* SUB-SIDEBAR (Aparece SOMENTE quando clica em Configurações) */}
          {abaAtiva === 'configuracoes' && (
            <aside className="w-full md:w-[240px] bg-[#141414] border-r border-[#2d2d2d] h-screen sticky top-0 shrink-0 z-10 hidden md:block">
              <div className="p-6 pb-2">
                <h2 className="text-white text-lg font-bold">Settings</h2>
              </div>
              <div className="px-3 py-2">
                <span className="px-3 text-[11px] font-bold text-zinc-500 tracking-wider uppercase mb-2 block">Administração</span>
                <button 
                  onClick={() => setSubAbaAtiva('exclusoes')}
                  className={`w-full text-left px-3 py-1.5 rounded text-sm font-medium transition-colors ${subAbaAtiva === 'exclusoes' ? 'bg-[#333] text-white' : 'text-zinc-400 hover:text-zinc-200'}`}
                >
                  Exclusões (Lixeira)
                </button>
              </div>
            </aside>
          )}

          {/* Conteúdo Principal */}
          <main className="flex-1 bg-[#0f0f0f] p-6 md:p-10 overflow-y-auto">
            
            {abaAtiva === 'painel' && (
              <div className="max-w-6xl">
                <h2 className="text-2xl font-bold mb-6 text-white">Painel Gerencial</h2>
                <div className="grid grid-cols-1 md:grid-cols-4 gap-5 mb-8">
                  <div className="bg-[#1c1c1c] border border-[#2d2d2d] p-5 rounded-xl shadow-sm">
                    <span className="text-xs font-medium text-zinc-400 uppercase tracking-wider">Faturamento</span>
                    <p className="text-2xl font-bold text-white mt-2">R$ {faturamento.toFixed(2)}</p>
                  </div>
                  <div className="bg-[#1c1c1c] border border-[#2d2d2d] p-5 rounded-xl shadow-sm">
                    <span className="text-xs font-medium text-zinc-400 uppercase tracking-wider">Lucro Produtos</span>
                    <p className="text-2xl font-bold text-green mt-2">R$ {lucroProdutos.toFixed(2)}</p>
                  </div>
                  <div className="bg-[#1c1c1c] border border-[#2d2d2d] p-5 rounded-xl shadow-sm">
                    <span className="text-xs font-medium text-zinc-400 uppercase tracking-wider">Despesas</span>
                    <p className="text-2xl font-bold text-red-500 mt-2">R$ {totalDespesas.toFixed(2)}</p>
                  </div>
                  <div className="bg-[#1c1c1c] border border-[#2d2d2d] p-5 rounded-xl shadow-sm">
                    <span className="text-xs font-medium text-zinc-400 uppercase tracking-wider">Resultado Mês</span>
                    <p className={`text-2xl font-bold mt-2 ${resultadoMes >= 0 ? 'text-orange' : 'text-red-500'}`}>R$ {resultadoMes.toFixed(2)}</p>
                  </div>
                </div>
                
                <div className="bg-[#1c1c1c] border border-[#2d2d2d] rounded-xl p-6 overflow-x-auto shadow-sm">
                  <h3 className="text-base font-semibold mb-4 text-white">Últimos Lançamentos</h3>
                  <table className="w-full text-left text-sm text-zinc-400">
                    <thead className="border-b border-[#2d2d2d]">
                      <tr>
                        <th className="pb-3 font-medium uppercase text-xs">Data</th>
                        <th className="pb-3 font-medium uppercase text-xs">Tipo</th>
                        <th className="pb-3 font-medium uppercase text-xs">Descrição / Item</th>
                        <th className="pb-3 font-medium uppercase text-xs">Canal</th>
                        <th className="pb-3 font-medium uppercase text-xs text-center">Qtd.</th>
                        <th className="pb-3 font-medium uppercase text-xs text-right">Valor</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-[#2d2d2d]">
                      {lancamentosAtivos.slice(0, 10).map(l => (
                        <tr key={l.id} className="hover:bg-[#252525] transition-colors">
                          <td className="py-3">{l.data}</td>
                          <td className="py-3">
                            <span className={`px-2 py-0.5 rounded text-xs font-medium ${l.tipo === 'Venda' ? 'bg-[#4A6332]/20 text-[#71994c]' : 'bg-red-950/40 text-red-400'}`}>
                              {l.tipo}
                            </span>
                          </td>
                          <td className="py-3 text-white font-medium">
                            {l.descricao} 
                            {l.fornecedor && <span className="text-xs font-normal text-zinc-500 block">Fornecedor: {l.fornecedor}</span>}
                          </td>
                          <td className="py-3">{l.canal_categoria}</td>
                          <td className="py-3 text-center text-white">{l.quantidade ? l.quantidade : '-'}</td>
                          <td className="py-3 text-right text-white font-medium">R$ {Number(l.valor_total).toFixed(2)}</td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              </div>
            )}

            {abaAtiva === 'lancamentos' && (
              <div className="max-w-6xl">
                <h2 className="text-2xl font-bold mb-6 text-white">Novo Lançamento</h2>
                
                <form onSubmit={handleSalvarLancamento} className="bg-[#1c1c1c] border border-[#2d2d2d] p-6 rounded-xl mb-10 space-y-6 shadow-sm">
                  <div className="grid grid-cols-1 md:grid-cols-4 gap-4">
                    <div>
                      <label className="block text-xs font-medium text-zinc-400 mb-1">Tipo de Operação</label>
                      <select value={novoLancamento.tipo} onChange={e => setNovoLancamento({...novoLancamento, tipo: e.target.value})} className="w-full bg-[#252525] border border-[#333] focus:border-[#D95B1E] focus:outline-none rounded-lg p-2.5 text-white transition-colors">
                        <option>Venda</option><option>Despesa</option>
                      </select>
                    </div>
                    <div>
                      <label className="block text-xs font-medium text-zinc-400 mb-1">Data</label>
                      <input type="date" value={novoLancamento.data} onChange={e => setNovoLancamento({...novoLancamento, data: e.target.value})} className="w-full bg-[#252525] border border-[#333] focus:border-[#D95B1E] focus:outline-none rounded-lg p-2.5 text-white transition-colors" required />
                    </div>
                    
                    {novoLancamento.tipo === 'Venda' ? (
                      <div className="col-span-2">
                        <label className="block text-xs font-medium text-zinc-400 mb-1">Produto Vendido</label>
                        <select value={novoLancamento.produto_id} onChange={e => setNovoLancamento({...novoLancamento, produto_id: e.target.value})} className="w-full bg-[#252525] border border-[#333] focus:border-[#D95B1E] focus:outline-none rounded-lg p-2.5 text-white transition-colors" required>
                          <option value="">Selecione o produto...</option>
                          {produtos.map(p => <option key={p.id} value={p.id}>{p.nome}</option>)}
                        </select>
                      </div>
                    ) : (
                      <>
                        <div>
                          <label className="block text-xs font-medium text-zinc-400 mb-1">Descrição da Despesa</label>
                          <input type="text" placeholder="Ex: Embalagens" value={novoLancamento.descricao} onChange={e => setNovoLancamento({...novoLancamento, descricao: e.target.value})} className="w-full bg-[#252525] border border-[#333] focus:border-[#D95B1E] focus:outline-none rounded-lg p-2.5 text-white transition-colors" required />
                        </div>
                        <div>
                          <label className="block text-xs font-medium text-zinc-400 mb-1">Fornecedor (Opcional)</label>
                          <input type="text" placeholder="Ex: Atacadão" value={novoLancamento.fornecedor} onChange={e => setNovoLancamento({...novoLancamento, fornecedor: e.target.value})} className="w-full bg-[#252525] border border-[#333] focus:border-[#D95B1E] focus:outline-none rounded-lg p-2.5 text-white transition-colors" />
                        </div>
                      </>
                    )}
                  </div>
                  
                  <div className="grid grid-cols-1 md:grid-cols-4 gap-4">
                    {novoLancamento.tipo === 'Venda' ? (
                      <div>
                        <label className="block text-xs font-medium text-zinc-400 mb-1">Quantidade</label>
                        <input type="number" min="1" value={novoLancamento.quantidade} onChange={e => setNovoLancamento({...novoLancamento, quantidade: e.target.value})} className="w-full bg-[#252525] border border-[#333] focus:border-[#D95B1E] focus:outline-none rounded-lg p-2.5 text-white transition-colors" required />
                      </div>
                    ) : (
                      <div>
                        <label className="block text-xs font-medium text-zinc-400 mb-1">Valor Total (R$)</label>
                        <input type="number" step="0.01" value={novoLancamento.valor_despesa} onChange={e => setNovoLancamento({...novoLancamento, valor_despesa: e.target.value})} className="w-full bg-[#252525] border border-[#333] focus:border-[#D95B1E] focus:outline-none rounded-lg p-2.5 text-white transition-colors" required />
                      </div>
                    )}
                    <div>
                      <label className="block text-xs font-medium text-zinc-400 mb-1">Forma de Pagamento</label>
                      <select value={novoLancamento.pagamento} onChange={e => setNovoLancamento({...novoLancamento, pagamento: e.target.value})} className="w-full bg-[#252525] border border-[#333] focus:border-[#D95B1E] focus:outline-none rounded-lg p-2.5 text-white transition-colors">
                        <option>Pix</option><option>Cartão</option><option>Dinheiro</option><option>Transferência</option><option>Outro</option>
                      </select>
                    </div>
                    <div>
                      <label className="block text-xs font-medium text-zinc-400 mb-1">Categoria / Canal</label>
                      <select value={novoLancamento.canal_categoria} onChange={e => setNovoLancamento({...novoLancamento, canal_categoria: e.target.value})} className="w-full bg-[#252525] border border-[#333] focus:border-[#D95B1E] focus:outline-none rounded-lg p-2.5 text-white transition-colors">
                        <option>Delivery</option><option>Retirada</option><option>Evento</option><option>Insumos</option><option>Embalagens</option><option>Bebidas</option><option>Outros</option>
                      </select>
                    </div>
                    <div className="flex items-end">
                      <button type="submit" className="w-full btn-orange font-semibold py-2.5 rounded-lg shadow-md transition-colors">Registrar Lançamento</button>
                    </div>
                  </div>
                </form>

                <div className="bg-[#1c1c1c] border border-[#2d2d2d] rounded-xl p-6 overflow-x-auto shadow-sm">
                  <h3 className="text-base font-semibold mb-4 text-white">Histórico Completo</h3>
                  <table className="w-full text-left text-sm text-zinc-400">
                    <thead className="border-b border-[#2d2d2d]">
                      <tr>
                        <th className="pb-3 font-medium uppercase text-xs">Data</th>
                        <th className="pb-3 font-medium uppercase text-xs">Tipo</th>
                        <th className="pb-3 font-medium uppercase text-xs">Descrição</th>
                        <th className="pb-3 font-medium uppercase text-xs text-center">Qtd</th>
                        <th className="pb-3 font-medium uppercase text-xs">Canal</th>
                        <th className="pb-3 font-medium uppercase text-xs text-right">Valor Total</th>
                        <th className="pb-3 font-medium uppercase text-xs text-center"></th>
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-[#2d2d2d]">
                      {lancamentosAtivos.map(l => (
                        <tr key={l.id} className="hover:bg-[#252525] transition-colors group">
                          <td className="py-3">{l.data}</td>
                          <td className="py-3">
                             <span className={`px-2 py-0.5 rounded text-xs font-medium ${l.tipo === 'Venda' ? 'bg-[#4A6332]/20 text-[#71994c]' : 'bg-red-950/40 text-red-400'}`}>
                              {l.tipo}
                            </span>
                          </td>
                          <td className="py-3 text-white font-medium">
                            {l.descricao}
                            {l.fornecedor && <span className="text-xs font-normal text-zinc-500 block">Fornecedor: {l.fornecedor}</span>}
                          </td>
                          <td className="py-3 text-center text-white">{l.quantidade ? l.quantidade : '-'}</td>
                          <td className="py-3">{l.canal_categoria}</td>
                          <td className="py-3 text-right text-white font-medium">R$ {Number(l.valor_total).toFixed(2)}</td>
                          <td className="py-3 text-center">
                            <button onClick={() => setModalExclusao({ aberto: true, idLancamento: l.id })} className="text-zinc-600 hover:text-red-500 opacity-0 group-hover:opacity-100 transition-all" title="Excluir Lançamento">
                              <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/><line x1="10" x2="10" y1="11" y2="17"/><line x1="14" x2="14" y1="11" y2="17"/></svg>
                            </button>
                          </td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              </div>
            )}

            {abaAtiva === 'produtos' && (
              <div className="max-w-6xl">
                <h2 className="text-2xl font-bold mb-6 text-white">Cadastro de Produtos</h2>
                <form onSubmit={handleSalvarProduto} className="bg-[#1c1c1c] border border-[#2d2d2d] p-6 rounded-xl space-y-6 shadow-sm">
                  <div className="grid grid-cols-1 md:grid-cols-4 gap-4">
                    <div>
                      <label className="block text-xs font-medium text-zinc-400 mb-1">Nome do Produto</label>
                      <input type="text" value={novoProduto.nome} onChange={e => setNovoProduto({...novoProduto, nome: e.target.value})} className="w-full bg-[#252525] border border-[#333] focus:border-[#D95B1E] focus:outline-none rounded-lg p-2.5 text-white transition-colors" required />
                    </div>
                    <div>
                      <label className="block text-xs font-medium text-zinc-400 mb-1">Preço de Venda (R$)</label>
                      <input type="number" step="0.01" value={novoProduto.preco_venda} onChange={e => setNovoProduto({...novoProduto, preco_venda: e.target.value})} className="w-full bg-[#252525] border border-[#333] focus:border-[#D95B1E] focus:outline-none rounded-lg p-2.5 text-white transition-colors" required />
                    </div>
                    <div>
                      <label className="block text-xs font-medium text-zinc-400 mb-1">Custo Unitário (R$)</label>
                      <input type="number" step="0.01" value={novoProduto.custo_unitario} onChange={e => setNovoProduto({...novoProduto, custo_unitario: e.target.value})} className="w-full bg-[#252525] border border-[#333] focus:border-[#D95B1E] focus:outline-none rounded-lg p-2.5 text-white transition-colors" required />
                    </div>
                    <div className="flex items-end">
                      <button type="submit" className="w-full bg-[#4A6332] hover:bg-[#3b4f28] text-white font-semibold py-2.5 rounded-lg shadow-md transition-colors">Salvar Produto</button>
                    </div>
                  </div>
                </form>
                
                 <div className="bg-[#1c1c1c] border border-[#2d2d2d] rounded-xl p-6 overflow-x-auto shadow-sm mt-6">
                  <h3 className="text-base font-semibold mb-4 text-white">Produtos Cadastrados</h3>
                  <table className="w-full text-left text-sm text-zinc-400">
                    <thead className="border-b border-[#2d2d2d]">
                      <tr>
                        <th className="pb-3 font-medium uppercase text-xs">Produto</th>
                        <th className="pb-3 font-medium uppercase text-xs">Preço Venda</th>
                        <th className="pb-3 font-medium uppercase text-xs">Custo</th>
                        <th className="pb-3 font-medium uppercase text-xs">Margem Bruta</th>
                        <th className="pb-3 font-medium uppercase text-xs text-center">Ação</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-[#2d2d2d]">
                      {produtos.map(p => {
                        const margem = Number(p.preco_venda) - Number(p.custo_unitario);
                        return (
                          <tr key={p.id} className="hover:bg-[#252525] transition-colors group">
                            <td className="py-3 text-white font-medium">{p.nome}</td>
                            <td className="py-3 text-white">R$ {Number(p.preco_venda).toFixed(2)}</td>
                            <td className="py-3">R$ {Number(p.custo_unitario).toFixed(2)}</td>
                            <td className="py-3 font-medium text-[#4A6332]">R$ {margem.toFixed(2)}</td>
                            <td className="py-3 text-center">
                                {/* BOTÃO DE DELETAR PRODUTO */}
                                <button 
                                  onClick={() => setModalExcluirProduto({ aberto: true, idProduto: p.id, nome: p.nome })} 
                                  className="text-zinc-600 hover:text-red-500 opacity-0 group-hover:opacity-100 transition-all" 
                                  title="Deletar Produto"
                                >
                                  <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/><line x1="10" x2="10" y1="11" y2="17"/><line x1="14" x2="14" y1="11" y2="17"/></svg>
                                </button>
                            </td>
                          </tr>
                        );
                      })}
                    </tbody>
                  </table>
                </div>
              </div>
            )}

            {/* ABA DE CONFIGURAÇÕES (LIXEIRA) */}
            {abaAtiva === 'configuracoes' && subAbaAtiva === 'exclusoes' && (
              <div className="max-w-6xl">
                <h2 className="text-2xl font-bold mb-2 text-white">Exclusões (Lixeira)</h2>
                <p className="text-sm text-zinc-400 mb-6">Aqui ficam registrados os lançamentos que foram excluídos do sistema para auditoria.</p>
                
                 <div className="bg-[#1c1c1c] border border-[#2d2d2d] rounded-xl p-6 overflow-x-auto shadow-sm">
                  <h3 className="text-base font-semibold mb-4 text-rose-500 flex items-center gap-2">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/><line x1="10" x2="10" y1="11" y2="17"/><line x1="14" x2="14" y1="11" y2="17"/></svg>
                    Histórico de Lançamentos Excluídos
                  </h3>

                  {lancamentosExcluidos.length === 0 ? (
                    <p className="text-zinc-500 text-sm italic">Nenhum lançamento excluído até o momento.</p>
                  ) : (
                    <table className="w-full text-left text-sm text-zinc-400">
                      <thead className="border-b border-[#2d2d2d]">
                        <tr>
                          <th className="pb-3 font-medium uppercase text-xs">Data</th>
                          <th className="pb-3 font-medium uppercase text-xs">Tipo</th>
                          <th className="pb-3 font-medium uppercase text-xs">Descrição</th>
                          <th className="pb-3 font-medium uppercase text-xs text-right">Valor</th>
                          <th className="pb-3 font-medium uppercase text-xs text-rose-400 pl-4">Motivo do Cancelamento</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-[#2d2d2d]">
                        {lancamentosExcluidos.map(l => (
                          <tr key={l.id} className="hover:bg-[#252525] transition-colors">
                            <td className="py-3">{l.data}</td>
                            <td className="py-3">
                              <span className={`px-2 py-0.5 rounded text-xs font-medium bg-zinc-800 text-zinc-300`}>
                                {l.tipo}
                              </span>
                            </td>
                            <td className="py-3 text-zinc-300 font-medium line-through decoration-zinc-600">
                              {l.descricao}
                            </td>
                            <td className="py-3 text-right text-zinc-300 font-medium line-through decoration-zinc-600">R$ {Number(l.valor_total).toFixed(2)}</td>
                            <td className="py-3 text-rose-400 font-semibold pl-4">{l.motivo_exclusao || 'Não informado'}</td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  )}
                </div>
              </div>
            )}

          </main>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
