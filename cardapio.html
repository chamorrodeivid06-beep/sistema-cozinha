<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cardápio | FoodStrick</title>
  <!-- Favicon padrão de todos os cardápios FoodStrick -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2064%2064%22%3E%0A%20%20%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2215%22%20fill%3D%22%23D95B1E%22%2F%3E%0A%20%20%3Cg%20fill%3D%22none%22%20stroke%3D%22%23fff%22%20stroke-width%3D%223.3%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%3E%0A%20%20%20%20%3Cpath%20d%3D%22M21%2011h22a3%203%200%200%201%203%203v38l-5-3-5%203-5-3-5%203-5-3-3%202V14a3%203%200%200%201%203-3z%22%2F%3E%0A%20%20%20%20%3Cpath%20d%3D%22M25%2022h14M25%2030h14M25%2038h8%22%2F%3E%0A%20%20%3C%2Fg%3E%0A%3C%2Fsvg%3E" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
:root{--accent:#D95B1E}*{box-sizing:border-box}body{background:#0c0c0d;color:#fafafa;font-family:system-ui,-apple-system,sans-serif}.accent{background:var(--accent)}.line{border-color:#29292c}.hero{position:relative;isolation:isolate;overflow:hidden;background:radial-gradient(ellipse at 90% 0%,color-mix(in srgb,var(--accent) 19%,transparent),transparent 60%),linear-gradient(135deg,#1b1b1d,#111113);border:1px solid #2b2b2d}.hero.has-cover{background-image:linear-gradient(90deg,rgba(8,8,10,.90),rgba(8,8,10,.48)),var(--cover-image);background-size:cover;background-position:center}.hero.has-cover:before{content:"";position:absolute;inset:0;background:linear-gradient(0deg,rgba(0,0,0,.28),transparent);z-index:-1}.food-card{background:#18181a;border:1px solid #303034;transition:border-color .2s,transform .2s}.food-card:hover{border-color:var(--accent);transform:translateY(-2px)}.food-image{aspect-ratio:4/3;width:100%;object-fit:cover;background:#27272a}.price{color:#ffae74}.qty-btn{width:38px;height:38px;border-radius:12px;font-weight:800}.pill{border:1px solid #3f3f46;background:#222225}.order-box{background:#18181a;border:1px solid #303034}input,select,textarea{color-scheme:dark}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}@media(prefers-reduced-motion:reduce){.hero.has-cover{background-image:linear-gradient(90deg,rgba(8,8,10,.90),rgba(8,8,10,.48)),var(--cover-image);background-size:cover;background-position:center}.hero.has-cover:before{content:"";position:absolute;inset:0;background:linear-gradient(0deg,rgba(0,0,0,.28),transparent);z-index:-1}.food-card{transition:none}}
</style>
</head>
<body>
  <main id="app" class="max-w-6xl mx-auto min-h-screen p-4 sm:p-8"><p class="text-zinc-400">Carregando cardápio...</p></main>
  <script>
    const SUPABASE_URL = 'https://ddngvelrtqmfgaeqsjem.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_EhLCuypZr6vHrSKDCrHxQg_n7BvKxBU';
    const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    const slug = new URLSearchParams(location.search).get('slug') || location.pathname.split('/').filter(Boolean).pop();
    const app = document.getElementById('app');
    let menu = null, products = [], cart = {};
    const money = v => Number(v || 0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
    const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    async function callRpc(name, payload={}) { const {data,error}=await sb.rpc(name,payload); if(error) throw error; return data; }
    const icon = (name) => {
      const paths = {
        delivery: '<rect x="1" y="5" width="14" height="12" rx="2"/><path d="M15 9h4l3 4v4h-7"/><circle cx="5" cy="18" r="2"/><circle cx="18" cy="18" r="2"/>',
        pickup: '<path d="M4 9h16l-1 12H5L4 9Z"/><path d="M9 9V6a3 3 0 0 1 6 0v3"/>',
        dining: '<path d="M4 3v7a3 3 0 0 0 6 0V3M7 3v18M17 3v18M17 3c-3 3-3 8 0 10h3V3"/>',
        cart: '<circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 2h2l3 14h14l3-10H4"/>',
        image: '<rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/>'
      };
      return `<svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="display:inline-block;vertical-align:middle;flex-shrink:0">${paths[name]||''}</svg>`;
    };
    function render() {
      document.documentElement.style.setProperty('--accent', menu.accent_color || '#D95B1E');
      const visibleProducts = products.filter(p => p.available !== false && p.menu_available !== false);
      const selected = visibleProducts.filter(p=>Number(cart[p.id]||0)>0);
      const total = selected.reduce((sum,p)=>sum+Number(cart[p.id])*Number(p.price??p.preco_venda??0),0);
      const count = selected.reduce((sum,p)=>sum+Number(cart[p.id]),0);
      const categories = [...new Set(visibleProducts.map(p => p.category || p.menu_category || 'Outros'))];
      const imageOf = p => p.image_url || p.menu_image_url || '';
      const cover = typeof menu.cover_image === 'string' && (/^data:image\/(jpeg|png|webp);base64,[A-Za-z0-9+/=]+$/.test(menu.cover_image) || /^https:\/\/[^"'<>\s]+$/.test(menu.cover_image)) ? menu.cover_image : '';
      document.documentElement.style.setProperty('--cover-image', cover ? `url("${cover}")` : 'none');
      app.innerHTML = `<header class="hero ${cover?'has-cover':''} rounded-3xl px-5 py-8 sm:px-10 sm:py-10 mb-8"><div class="inline-flex items-center gap-2 rounded-full bg-white/10 px-3 py-2 text-xs font-extrabold tracking-widest uppercase mb-5"><span class="w-2 h-2 rounded-full accent"></span> Cardápio digital</div><h1 class="text-3xl sm:text-5xl font-black tracking-tight">${esc(menu.name||'Cardápio')}</h1><p class="text-zinc-300 mt-3 max-w-2xl leading-relaxed">${esc(menu.description||'Escolha seus favoritos e faça seu pedido!')}</p><div class="mt-5 flex flex-wrap gap-2 text-xs text-zinc-200">${menu.allow_delivery?'<span class="pill px-3 py-2 rounded-full inline-flex items-center gap-2">'+icon('delivery')+' Entrega</span>':''}${menu.allow_pickup?'<span class="pill px-3 py-2 rounded-full inline-flex items-center gap-2">'+icon('pickup')+' Retirada</span>':''}<span class="pill px-3 py-2 rounded-full inline-flex items-center gap-2">${icon('dining')} Feito para você</span></div></header>
      <div class="flex flex-col lg:flex-row items-start gap-8"><div class="min-w-0 flex-1 w-full"><div class="mb-6"><h2 class="text-2xl font-black">Escolha seu favorito <span class="text-zinc-500 text-base font-medium">(${visibleProducts.length} opções)</span></h2><p class="text-zinc-400 text-sm mt-1">Fotos, detalhes e sabores para você escolher.</p></div>
      ${categories.map(category=>`<section class="mb-9"><h3 class="text-lg font-extrabold mb-4 flex items-center gap-2"><span class="inline-block w-1 h-6 rounded accent"></span>${esc(category)}</h3><div class="grid sm:grid-cols-2 gap-4">${visibleProducts.filter(p=>(p.category||p.menu_category||'Outros')===category).map(p=>`<article class="food-card rounded-2xl overflow-hidden flex flex-col">${imageOf(p)?`<img src="${esc(imageOf(p))}" alt="${esc(p.name||p.nome)}" class="food-image" loading="lazy" onerror="this.onerror=null;this.style.display='none';this.nextElementSibling?.classList.remove('hidden')"><div class="hidden bg-zinc-800 h-32 items-center justify-center text-zinc-500 text-sm p-4">Imagem indisponível</div>`:`<div class="bg-zinc-800/60 h-28 flex items-center justify-center text-zinc-500 text-sm">${icon('image')} Foto em breve</div>`}<div class="p-4 flex flex-col flex-1"><h4 class="text-lg font-extrabold">${esc(p.name||p.nome)}</h4>${(p.description||p.menu_description)?`<p class="text-sm text-zinc-300 mt-2 leading-relaxed">${esc(p.description||p.menu_description)}</p>`:''}${(p.ingredients||p.menu_ingredients)?`<p class="text-xs text-zinc-500 mt-2">Ingredientes: ${esc(p.ingredients||p.menu_ingredients)}</p>`:''}<div class="mt-auto pt-5 flex items-center justify-between gap-2 flex-wrap"><span class="price text-xl font-black">${money(p.price??p.preco_venda)}</span><div class="flex items-center gap-2"><button type="button" aria-label="Remover ${esc(p.name||p.nome)}" data-dec="${esc(p.id)}" class="qty-btn border line bg-zinc-900">−</button><span class="min-w-5 text-center font-bold" aria-live="polite">${Number(cart[p.id]||0)}</span><button type="button" aria-label="Adicionar ${esc(p.name||p.nome)}" data-inc="${esc(p.id)}" class="qty-btn accent">+</button></div></div></div></article>`).join('')}</div></section>`).join('')}
      ${visibleProducts.length?'':'<p class="text-zinc-400">Ainda não há produtos disponíveis.</p>'}</div>
      <aside class="order-box rounded-2xl p-5 w-full lg:w-[340px] lg:sticky lg:top-5"><h2 class="text-xl font-black">${icon('cart')} Seu pedido</h2><p class="text-zinc-400 text-sm mt-1 mb-4">${count?`${count} ${count===1?'item selecionado':'itens selecionados'}`:'Escolha um produto para começar.'}</p>${selected.length?`<div class="space-y-3 border-t line pt-4 mb-4">${selected.map(p=>`<div class="flex justify-between gap-2 text-sm"><span>${Number(cart[p.id])}× ${esc(p.name||p.nome)}</span><strong class="shrink-0">${money(Number(cart[p.id])*Number(p.price??p.preco_venda??0))}</strong></div>`).join('')}</div>`:''}<div class="flex justify-between text-lg font-black border-t line pt-4 mb-5"><span>Total</span><span class="price">${money(total)}</span></div>
      <form id="orderForm" class="space-y-3"><h3 class="font-bold">Finalizar pedido</h3><input name="customer_name" required maxlength="120" placeholder="Seu nome" autocomplete="name" class="w-full bg-[#242427] border line rounded-xl p-3 text-base"><input name="customer_phone" required maxlength="40" placeholder="Telefone / WhatsApp" autocomplete="tel" class="w-full bg-[#242427] border line rounded-xl p-3 text-base"><select name="order_type" id="orderType" class="w-full bg-[#242427] border line rounded-xl p-3 text-base">${menu.allow_delivery?'<option value="delivery">'+icon('delivery')+' Entrega</option>':''}${menu.allow_pickup?'<option value="pickup">'+icon('pickup')+' Retirada no local</option>':''}</select><input name="delivery_address" id="address" maxlength="400" placeholder="Endereço para entrega" autocomplete="street-address" class="w-full bg-[#242427] border line rounded-xl p-3 text-base"><select name="payment_method" class="w-full bg-[#242427] border line rounded-xl p-3 text-base">${(menu.payment_methods||['Pix','Dinheiro','Cartão']).map(x=>`<option>${esc(x)}</option>`).join('')}</select><textarea name="notes" maxlength="500" rows="2" placeholder="Observações (opcional)" class="w-full bg-[#242427] border line rounded-xl p-3 text-base"></textarea><button class="accent w-full rounded-xl p-4 font-extrabold disabled:opacity-50" type="submit" ${count?'':'disabled'}>Enviar pedido · ${money(total)}</button><p id="feedback" role="status" class="text-sm text-zinc-400"></p></form></aside></div>`;
      // Preserve form fields while customers add or remove products.
      const fields = app.querySelector('#orderForm');
      if(window.savedOrderFields && fields){for(const [key,value] of Object.entries(window.savedOrderFields)){const input=fields.elements.namedItem(key);if(input)input.value=value;}}
      function rememberFields(){const f=app.querySelector('#orderForm');window.savedOrderFields={};if(f){for(const [k,v] of new FormData(f).entries())window.savedOrderFields[k]=v;}}
      app.querySelectorAll('[data-inc]').forEach(b=>b.onclick=()=>{rememberFields();const id=b.dataset.inc;cart[id]=Math.min(99,Number(cart[id]||0)+1);render();});
      app.querySelectorAll('[data-dec]').forEach(b=>b.onclick=()=>{rememberFields();const id=b.dataset.dec;cart[id]=Math.max(0,Number(cart[id]||0)-1);render();});
      const type=app.querySelector('#orderType'),address=app.querySelector('#address');
      const toggle=()=>{if(!type||!address)return;address.style.display=type.value==='delivery'?'block':'none';address.required=type.value==='delivery';};if(type)type.onchange=toggle;toggle();
      app.querySelector('#orderForm').onsubmit=async e=>{e.preventDefault();const feedback=app.querySelector('#feedback');const form=new FormData(e.currentTarget);const items=visibleProducts.filter(p=>Number(cart[p.id]||0)>0).map(p=>({product_id:p.id,quantity:Number(cart[p.id])}));if(!items.length){feedback.textContent='Adicione pelo menos um item.';return;}const btn=e.currentTarget.querySelector('button[type=submit]');btn.disabled=true;btn.textContent='Enviando...';try{const result=await callRpc('foodstrick_create_order',{p_slug:slug,p_customer_name:form.get('customer_name'),p_customer_phone:form.get('customer_phone'),p_order_type:form.get('order_type'),p_delivery_address:form.get('delivery_address'),p_payment_method:form.get('payment_method'),p_notes:form.get('notes'),p_items:items});window.savedOrderFields=null;app.innerHTML=`<div class="min-h-[70vh] flex flex-col items-center justify-center text-center"><div class="accent rounded-full w-16 h-16 flex items-center justify-center text-3xl mb-5">✓</div><h1 class="text-2xl font-black">Pedido enviado!</h1><p class="text-zinc-400 mt-2">Número do pedido: <strong class="text-white">${esc(result.order_id)}</strong></p><p class="mt-3">Total: <strong>${money(result.total)}</strong></p><p class="text-sm text-zinc-500 mt-5">O estabelecimento precisa confirmar seu pedido.</p><button id="newOrder" class="accent rounded-xl px-6 py-3 mt-6 font-bold">Fazer outro pedido</button></div>`;app.querySelector('#newOrder').onclick=()=>{cart={};render();};}catch(err){feedback.textContent=err.message||'Não foi possível enviar o pedido.';btn.disabled=false;btn.textContent='Tentar novamente';}};
    }
    (async()=>{try{if(!slug)throw new Error('Link de cardápio inválido.');const result=await callRpc('foodstrick_public_menu',{p_slug:slug});menu=result.menu;products=result.products||[];if(!products.length){products=[];}render();}catch(e){app.innerHTML=`<div class="py-20 text-center"><h1 class="text-2xl font-bold">Cardápio indisponível</h1><p class="text-zinc-400 mt-2">${esc(e.message||'Tente novamente mais tarde.')}</p></div>`;}})();
  </script>
</body>
</html>
